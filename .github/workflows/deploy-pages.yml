name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/batman-workout-timer-dAWkP
      - claude/premium-finance-dashboard-4i909c
      - claude/greatest-mantras-website-2sx74h
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: finance-dashboard/package-lock.json

      - name: Install dependencies
        working-directory: finance-dashboard
        run: npm ci

      - name: Build dashboard (static export)
        working-directory: finance-dashboard
        run: npm run build
        env:
          GITHUB_PAGES: "true"

      - name: Assemble site
        run: |
          mkdir -p _site/dashboard
          cp *.html _site/ 2>/dev/null || true
          cp -r finance-dashboard/out/. _site/dashboard/

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
