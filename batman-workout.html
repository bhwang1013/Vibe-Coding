<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BATMAN WORKOUT</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;600;700&display=swap');

    :root {
      --bat-yellow: #FFD700;
      --bat-yellow-dark: #c9a800;
      --bat-black: #0a0a0a;
      --bat-dark: #111111;
      --bat-gray: #1a1a1a;
      --bat-mid: #222222;
      --bat-text: #e0e0e0;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bat-black);
      color: var(--bat-text);
      font-family: 'Oswald', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    /* ── City skyline ── */
    .skyline {
      width: 100%;
      height: 120px;
      position: relative;
      background: #050505;
      flex-shrink: 0;
    }
    .skyline svg { width: 100%; height: 100%; }

    /* ── Header ── */
    header {
      width: 100%;
      text-align: center;
      padding: 10px 20px 0;
      position: relative;
    }

    .bat-logo {
      width: 90px;
      filter: drop-shadow(0 0 18px #FFD700cc);
      margin-bottom: 6px;
      animation: logoGlow 3s ease-in-out infinite;
    }
    @keyframes logoGlow {
      0%, 100% { filter: drop-shadow(0 0 14px #FFD700aa); }
      50%       { filter: drop-shadow(0 0 30px #FFD700ff); }
    }

    .title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(2rem, 7vw, 3.8rem);
      letter-spacing: 6px;
      color: var(--bat-yellow);
      text-shadow: 0 0 30px #FFD70088;
      line-height: 1;
    }
    .subtitle {
      font-size: 0.75rem;
      letter-spacing: 4px;
      color: #888;
      text-transform: uppercase;
      margin-top: 2px;
    }

    /* ── Main card ── */
    .card {
      background: var(--bat-gray);
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 28px 28px 32px;
      margin: 20px 16px 32px;
      width: min(480px, calc(100% - 32px));
      box-shadow: 0 8px 40px #00000099, inset 0 1px 0 #333;
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: '';
      position: absolute;
      top: -60px; left: 50%; transform: translateX(-50%);
      width: 300px; height: 120px;
      background: radial-gradient(ellipse, #FFD70015 0%, transparent 70%);
      pointer-events: none;
    }

    /* ── Phase labels ── */
    .phase-label {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 0.85rem;
      letter-spacing: 3px;
      color: var(--bat-yellow);
      text-transform: uppercase;
      margin-bottom: 10px;
      opacity: 0.8;
    }

    /* ── Exercise picker ── */
    .exercise-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 24px;
    }
    .exercise-btn {
      background: var(--bat-mid);
      border: 1px solid #333;
      border-radius: 10px;
      padding: 14px 10px;
      cursor: pointer;
      text-align: center;
      transition: all 0.18s ease;
      position: relative;
      overflow: hidden;
    }
    .exercise-btn:hover {
      border-color: var(--bat-yellow-dark);
      background: #2a2a2a;
    }
    .exercise-btn.selected {
      border-color: var(--bat-yellow);
      background: #252100;
      box-shadow: 0 0 16px #FFD70033;
    }
    .exercise-btn.selected::after {
      content: '✔';
      position: absolute;
      top: 6px; right: 8px;
      color: var(--bat-yellow);
      font-size: 0.7rem;
    }
    .ex-icon { font-size: 1.8rem; display: block; margin-bottom: 4px; }
    .ex-name {
      font-size: 0.78rem;
      letter-spacing: 1.5px;
      color: #ccc;
      text-transform: uppercase;
    }
    .exercise-btn.selected .ex-name { color: var(--bat-yellow); }

    /* ── Divider ── */
    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, #333, transparent);
      margin: 0 0 22px;
    }

    /* ── Rep input ── */
    .rep-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }
    .rep-label {
      font-size: 0.75rem;
      letter-spacing: 2px;
      color: #888;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .rep-controls {
      display: flex;
      align-items: center;
      gap: 0;
      background: var(--bat-mid);
      border: 1px solid #333;
      border-radius: 8px;
      overflow: hidden;
    }
    .rep-adj {
      background: none;
      border: none;
      color: var(--bat-yellow);
      font-size: 1.3rem;
      font-family: 'Oswald', sans-serif;
      width: 40px; height: 44px;
      cursor: pointer;
      transition: background 0.15s;
      display: flex; align-items: center; justify-content: center;
    }
    .rep-adj:hover { background: #2a2a00; }
    .rep-num {
      width: 70px; height: 44px;
      background: none;
      border: none;
      color: var(--bat-yellow);
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.6rem;
      text-align: center;
      outline: none;
      -moz-appearance: textfield;
    }
    .rep-num::-webkit-inner-spin-button,
    .rep-num::-webkit-outer-spin-button { -webkit-appearance: none; }

    /* ── Timer display ── */
    .timer-wrap {
      text-align: center;
      margin-bottom: 26px;
    }
    .timer-ring {
      position: relative;
      display: inline-block;
      width: 160px; height: 160px;
    }
    .timer-ring svg {
      transform: rotate(-90deg);
      position: absolute; top: 0; left: 0;
    }
    .ring-bg { fill: none; stroke: #222; stroke-width: 8; }
    .ring-prog {
      fill: none;
      stroke: var(--bat-yellow);
      stroke-width: 8;
      stroke-linecap: round;
      stroke-dasharray: 440;
      stroke-dashoffset: 440;
      filter: drop-shadow(0 0 6px #FFD700);
      transition: stroke-dashoffset 0.5s linear;
    }
    .timer-inner {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .timer-digits {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 3rem;
      letter-spacing: 4px;
      color: var(--bat-yellow);
      text-shadow: 0 0 20px #FFD70099;
      line-height: 1;
    }
    .timer-state {
      font-size: 0.6rem;
      letter-spacing: 3px;
      color: #666;
      text-transform: uppercase;
      margin-top: 2px;
    }

    /* ── Buttons ── */
    .btn-row {
      display: flex;
      gap: 12px;
    }
    .btn {
      flex: 1;
      border: none;
      border-radius: 10px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.25rem;
      letter-spacing: 3px;
      cursor: pointer;
      padding: 16px 12px;
      transition: all 0.18s ease;
      position: relative;
      overflow: hidden;
    }
    .btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0.07);
      opacity: 0;
      transition: opacity 0.15s;
    }
    .btn:hover::after { opacity: 1; }
    .btn:active { transform: scale(0.97); }

    .btn-start {
      background: linear-gradient(135deg, #c9a800, #FFD700);
      color: #111;
      box-shadow: 0 4px 20px #FFD70055;
    }
    .btn-start:hover { box-shadow: 0 6px 28px #FFD70099; }
    .btn-start:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      box-shadow: none;
    }
    .btn-done {
      background: linear-gradient(135deg, #1c1c1c, #2a2a2a);
      color: var(--bat-yellow);
      border: 1px solid #444;
    }
    .btn-done:disabled {
      opacity: 0.25;
      cursor: not-allowed;
    }
    .btn-reset {
      background: none;
      color: #555;
      border: 1px solid #2a2a2a;
      font-size: 0.9rem;
      letter-spacing: 2px;
      flex: 0 0 auto;
      padding: 16px 16px;
    }
    .btn-reset:hover { color: #999; border-color: #444; }

    /* ── Result panel ── */
    .result-panel {
      display: none;
      text-align: center;
      padding: 22px 16px;
      border-radius: 12px;
      background: #0d0d00;
      border: 1px solid var(--bat-yellow-dark);
      box-shadow: 0 0 30px #FFD70022;
      animation: fadeUp 0.4s ease;
    }
    .result-panel.visible { display: block; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .result-hero {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.1rem;
      letter-spacing: 5px;
      color: var(--bat-yellow);
      margin-bottom: 14px;
    }
    .result-stats {
      display: flex;
      justify-content: center;
      gap: 30px;
    }
    .stat { text-align: center; }
    .stat-val {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.4rem;
      color: var(--bat-yellow);
      line-height: 1;
      text-shadow: 0 0 16px #FFD70077;
    }
    .stat-lbl {
      font-size: 0.6rem;
      letter-spacing: 2px;
      color: #666;
      text-transform: uppercase;
    }
    .quote {
      font-size: 0.72rem;
      color: #555;
      font-style: italic;
      margin-top: 14px;
      letter-spacing: 0.5px;
      line-height: 1.5;
    }

    /* ── Flash overlay ── */
    .flash {
      position: fixed; inset: 0;
      background: var(--bat-yellow);
      opacity: 0;
      pointer-events: none;
      z-index: 999;
      animation: none;
    }
    .flash.go { animation: flash 0.25s ease-out; }
    @keyframes flash {
      0%   { opacity: 0.3; }
      100% { opacity: 0; }
    }

    /* ── Footer ── */
    footer {
      font-size: 0.6rem;
      letter-spacing: 3px;
      color: #333;
      text-align: center;
      padding-bottom: 20px;
    }

    /* ── Responsive tweaks ── */
    @media (max-width: 360px) {
      .exercise-grid { grid-template-columns: 1fr 1fr; }
      .timer-digits { font-size: 2.4rem; }
    }
  </style>
</head>

<!-- Main card -->
<main class="card">

  <!-- Step 1: Choose exercise -->
  <div class="phase-label">01 — Choose Your Mission</div>
  <div class="exercise-grid" id="exerciseGrid">
    <button class="exercise-btn selected" data-ex="pushups" onclick="selectExercise(this)">
      <span class="ex-icon">💪</span>
      <span class="ex-name">Push-Ups</span>
    </button>
    <button class="exercise-btn" data-ex="squats" onclick="selectExercise(this)">
      <span class="ex-icon">🦵</span>
      <span class="ex-name">Squats</span>
    </button>
    <button class="exercise-btn" data-ex="calf-raises" onclick="selectExercise(this)">
      <span class="ex-icon">🦿</span>
      <span class="ex-name">Calf Raises</span>
    </button>
    <button class="exercise-btn" data-ex="lateral-raises" onclick="selectExercise(this)">
      <span class="ex-icon">🏋️</span>
      <span class="ex-name">Lateral Raises</span>
    </button>
  </div>

  <div class="divider"></div>

  <!-- Step 2: Set reps -->
  <div class="phase-label">02 — Set Your Reps</div>
  <div class="rep-row">
    <span class="rep-label">Target Reps</span>
    <div class="rep-controls">
      <button class="rep-adj" onclick="adjustReps(-5)" title="-5">−</button>
      <input class="rep-num" type="number" id="repInput" value="10" min="1" max="999" />
      <button class="rep-adj" onclick="adjustReps(+5)" title="+5">+</button>
    </div>
  </div>

  <div class="divider"></div>

  <!-- Step 3: Timer -->
  <div class="phase-label">03 — Execute</div>
  <div class="timer-wrap">
    <div class="timer-ring">
      <svg viewBox="0 0 160 160" width="160" height="160">
        <circle class="ring-bg"   cx="80" cy="80" r="70"/>
        <circle class="ring-prog" cx="80" cy="80" r="70" id="ringProg"/>
      </svg>
      <div class="timer-inner">
        <div class="timer-digits" id="timerDisplay">00:00</div>
        <div class="timer-state"  id="timerState">Ready</div>
      </div>
    </div>
  </div>

  <!-- CTA buttons -->
  <div class="btn-row">
    <button class="btn btn-start" id="btnStart" onclick="startWorkout()">⚡ Start</button>
    <button class="btn btn-done"  id="btnDone"  onclick="doneWorkout()" disabled>Done</button>
    <button class="btn btn-reset" id="btnReset" onclick="resetAll()" title="Reset">↺</button>
  </div>

  <!-- Result panel (hidden until done) -->
  <div class="result-panel" id="resultPanel">
    <div class="result-hero">Mission Complete, Dark Knight</div>
    <div class="result-stats">
      <div class="stat">
        <div class="stat-val" id="resTime">--:--</div>
        <div class="stat-lbl">Time</div>
      </div>
      <div class="stat">
        <div class="stat-val" id="resReps">--</div>
        <div class="stat-lbl">Reps</div>
      </div>
      <div class="stat">
        <div class="stat-val" id="resExercise">--</div>
        <div class="stat-lbl">Exercise</div>
      </div>
    </div>
    <div class="quote" id="resQuote"></div>
  </div>

</main>

<footer>GOTHAM NEVER SLEEPS &nbsp;|&nbsp; NOR DOES THE BATMAN</footer>

<script>
  /* ── State ── */
  let selectedExercise = 'pushups';
  let timerInterval = null;
  let elapsedSeconds = 0;
  let isRunning = false;

  /* ── Exercise selection ── */
  function selectExercise(btn) {
    if (isRunning) return;
    document.querySelectorAll('.exercise-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedExercise = btn.dataset.ex;
  }

  /* ── Rep adjusters ── */
  function adjustReps(delta) {
    const inp = document.getElementById('repInput');
    const cur = parseInt(inp.value) || 0;
    inp.value = Math.max(1, Math.min(999, cur + delta));
  }

  /* ── Timer helpers ── */
  function formatTime(secs) {
    const m = String(Math.floor(secs / 60)).padStart(2, '0');
    const s = String(secs % 60).padStart(2, '0');
    return `${m}:${s}`;
  }

  /* Ring: max 10 min (600s) */
  const CIRCUMFERENCE = 2 * Math.PI * 70; // ≈ 440
  function updateRing(secs) {
    const maxSecs = 600;
    const ratio = Math.min(secs / maxSecs, 1);
    const offset = CIRCUMFERENCE * (1 - ratio);
    document.getElementById('ringProg').style.strokeDashoffset = offset;
  }

  /* ── Start ── */
  function startWorkout() {
    if (isRunning) return;

    // Flash
    const fl = document.getElementById('flash');
    fl.classList.remove('go');
    void fl.offsetWidth;
    fl.classList.add('go');

    isRunning = true;
    elapsedSeconds = 0;

    document.getElementById('btnStart').disabled = true;
    document.getElementById('btnDone').disabled = false;
    document.getElementById('timerState').textContent = 'Active';
    document.getElementById('resultPanel').classList.remove('visible');

    // Lock exercise & reps
    document.querySelectorAll('.exercise-btn').forEach(b => b.style.pointerEvents = 'none');

    timerInterval = setInterval(() => {
      elapsedSeconds++;
      document.getElementById('timerDisplay').textContent = formatTime(elapsedSeconds);
      updateRing(elapsedSeconds);
    }, 1000);
  }

  /* ── Done ── */
  function doneWorkout() {
    if (!isRunning) return;
    clearInterval(timerInterval);
    isRunning = false;

    const finalTime = formatTime(elapsedSeconds);
    const reps = parseInt(document.getElementById('repInput').value) || 0;

    document.getElementById('btnDone').disabled = true;
    document.getElementById('timerState').textContent = 'Done!';

    // Populate results
    document.getElementById('resTime').textContent = finalTime;
    document.getElementById('resReps').textContent = reps;
    document.getElementById('resExercise').textContent = exerciseShortName();
    document.getElementById('resQuote').textContent = batmanQuote(reps, elapsedSeconds);
    document.getElementById('resultPanel').classList.add('visible');

    // Flash
    const fl = document.getElementById('flash');
    fl.classList.remove('go');
    void fl.offsetWidth;
    fl.classList.add('go');
  }

  /* ── Reset ── */
  function resetAll() {
    clearInterval(timerInterval);
    isRunning = false;
    elapsedSeconds = 0;

    document.getElementById('timerDisplay').textContent = '00:00';
    document.getElementById('timerState').textContent = 'Ready';
    document.getElementById('btnStart').disabled = false;
    document.getElementById('btnDone').disabled = true;
    document.getElementById('resultPanel').classList.remove('visible');
    document.getElementById('ringProg').style.strokeDashoffset = CIRCUMFERENCE;

    document.querySelectorAll('.exercise-btn').forEach(b => b.style.pointerEvents = '');
  }

  /* ── Helpers ── */
  function exerciseShortName() {
    const map = {
      'pushups': 'Push', 'squats': 'Squat',
      'calf-raises': 'Calves', 'lateral-raises': 'Lateral'
    };
    return map[selectedExercise] || selectedExercise;
  }

  function batmanQuote(reps, secs) {
    const quotes = [
      '"It\'s not who I am underneath, but what I do that defines me."',
      '"Why do we fall? So we can learn to pick ourselves back up."',
      '"Endure, Master Wayne. Take it."',
      '"I\'m not wearing hockey pads."',
      '"A hero can be anyone. Even someone doing something small like finishing a workout."',
      '"The night is darkest just before the dawn. And the burn is real just before the gain."',
      '"You either die a hero, or live long enough to skip leg day. You didn\'t."',
      '"Some men just want to watch the world... get fit."',
    ];
    return quotes[Math.floor(Math.random() * quotes.length)];
  }

  /* ── Init ring ── */
  document.getElementById('ringProg').style.strokeDasharray = CIRCUMFERENCE;
  document.getElementById('ringProg').style.strokeDashoffset = CIRCUMFERENCE;
</script>
