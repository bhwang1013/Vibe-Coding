<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bucket List Hotels</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --gold: #c9a84c;
      --gold-light: #e8c96d;
      --gold-dim: rgba(201,168,76,0.15);
      --dark: #080808;
      --dark2: #111;
      --dark3: #181818;
      --dark4: #222;
      --text: #e8e4de;
      --muted: #888;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      background: var(--dark);
      color: var(--text);
      font-family: 'Montserrat', sans-serif;
      font-weight: 300;
      min-height: 100vh;
    }

    /* ── HERO ── */
    .hero {
      position: relative;
      height: 100vh;
      min-height: 600px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
    }

    .hero-bg {
      position: absolute;
      inset: 0;
      background-image: url('https://images.unsplash.com/photo-1540541338287-41700207dee6?auto=format&fit=crop&w=1920&q=80');
      background-size: cover;
      background-position: center;
      filter: brightness(0.35);
      transform: scale(1.05);
      animation: slowZoom 20s ease-in-out infinite alternate;
    }

    @keyframes slowZoom {
      from { transform: scale(1.05); }
      to   { transform: scale(1.12); }
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(8,8,8,0.3) 0%, rgba(8,8,8,0.1) 50%, rgba(8,8,8,0.9) 100%);
    }

    .hero-content { position: relative; z-index: 2; padding: 0 20px; }

    .hero-eyebrow {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 24px;
    }

    .hero h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(52px, 10vw, 110px);
      font-weight: 300;
      line-height: 1;
      margin-bottom: 24px;
      text-shadow: 0 2px 40px rgba(0,0,0,0.8);
    }

    .hero h1 em { font-style: italic; color: var(--gold-light); }

    .hero-sub {
      font-size: 13px;
      letter-spacing: 2px;
      color: rgba(232,228,222,0.7);
      margin-bottom: 48px;
    }

    .hero-count {
      display: inline-flex;
      align-items: center;
      gap: 16px;
      border: 1px solid rgba(201,168,76,0.4);
      padding: 14px 32px;
      font-size: 11px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--gold);
    }

    .hero-scroll {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(232,228,222,0.5);
      animation: bounce 2s ease-in-out infinite;
    }

    .hero-scroll::after {
      content: '';
      width: 1px;
      height: 40px;
      background: linear-gradient(to bottom, var(--gold), transparent);
    }

    @keyframes bounce {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50%       { transform: translateX(-50%) translateY(6px); }
    }

    /* ── NAV ── */
    .sticky-nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(8,8,8,0.95);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(201,168,76,0.15);
      padding: 0 20px;
    }

    .nav-inner {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
      gap: 16px;
    }

    .nav-logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 18px;
      font-weight: 400;
      color: var(--gold);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .filters {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      flex: 1;
      justify-content: flex-end;
    }
    .filters::-webkit-scrollbar { display: none; }

    .filter-btn {
      flex-shrink: 0;
      background: none;
      border: 1px solid rgba(201,168,76,0.25);
      color: rgba(232,228,222,0.6);
      padding: 6px 14px;
      font-family: 'Montserrat', sans-serif;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.25s;
      border-radius: 2px;
    }

    .filter-btn:hover, .filter-btn.active {
      background: var(--gold-dim);
      border-color: var(--gold);
      color: var(--gold-light);
    }

    /* ── GRID ── */
    .grid-section {
      max-width: 1400px;
      margin: 0 auto;
      padding: 80px 20px 120px;
    }

    .section-label {
      font-size: 10px;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 60px;
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, rgba(201,168,76,0.4), transparent);
    }

    .hotel-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 2px;
    }

    /* ── CARD ── */
    .card {
      position: relative;
      overflow: hidden;
      cursor: pointer;
      aspect-ratio: 4/3;
      background: var(--dark3);
    }

    .card.hidden { display: none; }

    .card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.7s cubic-bezier(0.25,0.46,0.45,0.94);
      display: block;
    }

    .card:hover .card-img { transform: scale(1.08); }

    .card-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(8,8,8,0.95) 0%, rgba(8,8,8,0.5) 45%, rgba(8,8,8,0.1) 100%);
      transition: background 0.4s;
    }

    .card:hover .card-overlay {
      background: linear-gradient(to top, rgba(8,8,8,0.98) 0%, rgba(8,8,8,0.6) 55%, rgba(8,8,8,0.2) 100%);
    }

    .card-body {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 28px 24px;
    }

    .card-num {
      font-size: 10px;
      letter-spacing: 4px;
      color: var(--gold);
      margin-bottom: 8px;
    }

    .card-location {
      font-family: 'Cormorant Garamond', serif;
      font-size: 26px;
      font-weight: 400;
      line-height: 1.1;
      margin-bottom: 4px;
    }

    .card-hotel {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 1.5px;
      color: rgba(232,228,222,0.75);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-suite {
      font-size: 10px;
      letter-spacing: 1px;
      color: var(--gold);
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      transition: max-height 0.4s, opacity 0.4s, margin 0.4s;
    }

    .card:hover .card-suite {
      max-height: 40px;
      opacity: 1;
      margin-top: 10px;
    }

    .card-tag {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(8,8,8,0.7);
      border: 1px solid rgba(201,168,76,0.3);
      color: var(--gold);
      font-size: 8px;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 4px 10px;
      backdrop-filter: blur(4px);
    }

    /* fallback gradient for broken images */
    .card-img-fallback {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #1a1a1a 0%, #2a2015 50%, #1a1a1a 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── MODAL ── */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(8,8,8,0.92);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s;
      backdrop-filter: blur(10px);
    }

    .modal-backdrop.open { opacity: 1; pointer-events: all; }

    .modal {
      background: var(--dark2);
      border: 1px solid rgba(201,168,76,0.2);
      max-width: 900px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--gold) transparent;
      transform: translateY(30px);
      transition: transform 0.35s;
    }

    .modal-backdrop.open .modal { transform: translateY(0); }

    .modal-img {
      width: 100%;
      height: 420px;
      object-fit: cover;
      display: block;
    }

    .modal-body { padding: 40px; }

    .modal-num {
      font-size: 10px;
      letter-spacing: 5px;
      color: var(--gold);
      margin-bottom: 12px;
    }

    .modal-location {
      font-family: 'Cormorant Garamond', serif;
      font-size: 48px;
      font-weight: 300;
      line-height: 1;
      margin-bottom: 8px;
    }

    .modal-hotel {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 2px;
      color: rgba(232,228,222,0.8);
      margin-bottom: 28px;
    }

    .modal-divider {
      width: 60px;
      height: 1px;
      background: linear-gradient(to right, var(--gold), transparent);
      margin-bottom: 28px;
    }

    .modal-suite-label {
      font-size: 9px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 6px;
    }

    .modal-suite-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 22px;
      font-weight: 300;
      font-style: italic;
      color: var(--gold-light);
      margin-bottom: 32px;
    }

    .modal-desc-label {
      font-size: 9px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: rgba(201,168,76,0.6);
      margin-bottom: 12px;
    }

    .modal-desc {
      font-size: 13px;
      line-height: 1.85;
      color: rgba(232,228,222,0.75);
      font-weight: 300;
    }

    .modal-close {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(8,8,8,0.7);
      border: 1px solid rgba(201,168,76,0.3);
      color: var(--text);
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 18px;
      backdrop-filter: blur(4px);
      transition: background 0.2s;
    }

    .modal-close:hover { background: rgba(201,168,76,0.2); }
    .modal-wrapper { position: relative; }

    /* ── FOOTER ── */
    footer {
      border-top: 1px solid rgba(201,168,76,0.1);
      padding: 40px 20px;
      text-align: center;
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--muted);
    }

    footer span { color: var(--gold); }

    /* ── RESPONSIVE ── */
    @media (max-width: 768px) {
      .hero h1 { font-size: clamp(40px, 12vw, 80px); }
      .hotel-grid { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
      .modal-img { height: 260px; }
      .modal-body { padding: 24px; }
      .modal-location { font-size: 36px; }
    }

    @media (max-width: 480px) {
      .hotel-grid { grid-template-columns: 1fr 1fr; gap: 1px; }
      .card-location { font-size: 18px; }
      .card-hotel { display: none; }
    }
  </style>
</head>

</nav>

<!-- FOOTER -->
<footer><span>40</span> Dreams &nbsp;·&nbsp; One List</footer>

const regionLabels = { usa:"USA", latam:"Latin America", europe:"Europe", middleeast:"Middle East", asia:"Asia", pacific:"Pacific", africa:"Africa" };

const grid = document.getElementById('hotelGrid');

function buildCards() {
  grid.innerHTML = '';
  hotels.forEach(h => {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.region = h.region;
    card.innerHTML = `
      <img
        class="card-img"
        src="${h.img}"
        alt="${h.location}"
        loading="lazy"
        onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"
      />
      <div class="card-img-fallback" style="position:absolute;inset:0;display:none;"></div>
      <div class="card-overlay"></div>
      <div class="card-tag">${regionLabels[h.region]}</div>
      <div class="card-body">
        <div class="card-num">${String(h.n).padStart(2,'0')}</div>
        <div class="card-location">${h.location}</div>
        <div class="card-hotel">${h.hotel}</div>
        <div class="card-suite">${h.suite}</div>
      </div>`;
    card.addEventListener('click', () => openModal(h));
    grid.appendChild(card);
  });
}

buildCards();

// Filters
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const f = btn.dataset.filter;
    document.querySelectorAll('.card').forEach(c => {
      c.classList.toggle('hidden', f !== 'all' && c.dataset.region !== f);
    });
  });
});

// Modal
const backdrop = document.getElementById('modalBackdrop');

function openModal(h) {
  document.getElementById('modalImg').src = h.img.replace('w=900', 'w=1400');
  document.getElementById('modalImg').alt = h.location;
  document.getElementById('modalNum').textContent = `No. ${String(h.n).padStart(2,'0')} · ${regionLabels[h.region]}`;
  document.getElementById('modalLocation').textContent = h.location;
  document.getElementById('modalHotel').textContent = h.hotel;
  document.getElementById('modalSuite').textContent = h.suite;
  document.getElementById('modalDesc').textContent = h.desc;
  document.getElementById('modal').scrollTop = 0;
  backdrop.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  backdrop.classList.remove('open');
  document.body.style.overflow = '';
}

document.getElementById('modalClose').addEventListener('click', closeModal);
backdrop.addEventListener('click', e => { if (e.target === backdrop) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
</script>
