<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>BATMAN WORKOUT</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@300;400;600;700&display=swap');

    /* ── Variables ── */
    :root {
      --bat-yellow:      #FFD700;
      --bat-yellow-dark: #c9a800;
      --bat-yellow-dim:  #FFD70033;
      --bat-black:       #0a0a0a;
      --bat-dark:        #111111;
      --bat-gray:        #1a1a1a;
      --bat-mid:         #222222;
      --bat-border:      #2d2d2d;
      --bat-text:        #e0e0e0;
      --bat-muted:       #666;
      --safe-bottom:     env(safe-area-inset-bottom, 0px);
    }

    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bat-black);
      color: var(--bat-text);
      font-family: 'Oswald', sans-serif;
      font-weight: 400;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
    }
    input { font-family: 'Oswald', sans-serif; }
    button { font-family: 'Oswald', sans-serif; cursor: pointer; border: none; background: none; }

    /* ── App shell ── */
    #app { min-height: 100vh; display: flex; flex-direction: column; }

    /* ══════════════════════════════════════════
       SHARED COMPONENTS
    ══════════════════════════════════════════ */

    /* Skyline */
    .skyline { width: 100%; height: 90px; flex-shrink: 0; background: #050505; display: block; }
    .skyline svg { width: 100%; height: 100%; }

    /* Bat logo */
    .bat-logo {
      width: 64px;
      filter: drop-shadow(0 0 14px #FFD700bb);
      animation: logoGlow 3s ease-in-out infinite;
    }
    @keyframes logoGlow {
      0%,100% { filter: drop-shadow(0 0 10px #FFD700aa); }
      50%      { filter: drop-shadow(0 0 26px #FFD700ff); }
    }

    /* Flash overlay */
    #flash {
      position: fixed; inset: 0; background: var(--bat-yellow);
      opacity: 0; pointer-events: none; z-index: 9999;
    }
    #flash.go { animation: flashAnim .22s ease-out forwards; }
    @keyframes flashAnim { 0%{opacity:.35} 100%{opacity:0} }

    /* Section label */
    .section-label {
      font-family: 'Bebas Neue', sans-serif;
      font-size: .7rem; letter-spacing: 3px;
      color: var(--bat-yellow); opacity: .7;
      text-transform: uppercase;
    }

    /* Yellow button */
    .btn-yellow {
      background: linear-gradient(135deg, var(--bat-yellow-dark), var(--bat-yellow));
      color: #111; border-radius: 10px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.2rem; letter-spacing: 3px;
      padding: 15px 24px;
      box-shadow: 0 4px 20px #FFD70044;
      transition: box-shadow .15s, transform .1s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-yellow:hover  { box-shadow: 0 6px 28px #FFD70099; }
    .btn-yellow:active { transform: scale(.97); }

    /* ══════════════════════════════════════════
       SCREEN: HOME
    ══════════════════════════════════════════ */
    #screen-home {
      display: flex; flex-direction: column; align-items: center;
      padding-bottom: calc(32px + var(--safe-bottom));
    }
    .home-header { width: 100%; text-align: center; padding: 14px 20px 18px; }
    .home-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(2rem, 8vw, 3.4rem);
      letter-spacing: 6px; color: var(--bat-yellow);
      text-shadow: 0 0 28px #FFD70066; line-height: 1;
    }
    .home-sub { font-size: .65rem; letter-spacing: 4px; color: var(--bat-muted); margin-top: 2px; }

    .template-section { width: min(480px, calc(100% - 32px)); margin-bottom: 4px; }
    .tmpl-group       { width: min(480px, calc(100% - 32px)); margin-bottom: 18px; }
    .tmpl-group-header {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 10px; padding: 0 2px;
    }
    .tmpl-group-icon { font-size: 1rem; }
    .tmpl-group-label {
      font-family: 'Bebas Neue', sans-serif;
      font-size: .7rem; letter-spacing: 3px;
      color: var(--bat-yellow); opacity: .7;
      text-transform: uppercase;
    }
    .template-label   { margin-bottom: 10px; }
    .template-card {
      background: var(--bat-gray); border: 1px solid var(--bat-border);
      border-radius: 14px; padding: 16px 18px;
      cursor: pointer; transition: border-color .15s, background .15s;
      width: 100%; text-align: left; margin-bottom: 10px;
    }
    .template-card:hover  { border-color: #444; background: #202020; }
    .template-card:active { transform: scale(.99); }
    .template-name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.05rem; letter-spacing: 2px;
      color: var(--bat-yellow); margin-bottom: 6px;
    }
    .template-exercises { font-size: .72rem; color: #888; letter-spacing: .5px; line-height: 1.6; }

    .start-wrap { width: min(480px, calc(100% - 32px)); }
    .start-wrap .btn-yellow { width: 100%; font-size: 1.4rem; padding: 18px; }

    /* ══════════════════════════════════════════
       SCREEN: WORKOUT
    ══════════════════════════════════════════ */
    #screen-workout { display: flex; flex-direction: column; min-height: 100vh; }

    /* Top bar */
    .top-bar {
      position: sticky; top: 0; z-index: 100;
      background: #0e0e0e; border-bottom: 1px solid var(--bat-border);
      padding: 10px 14px;
      display: flex; align-items: center; gap: 10px;
    }
    .top-bar-name {
      flex: 1; background: none; border: none; outline: none;
      color: var(--bat-text); font-family: 'Bebas Neue', sans-serif;
      font-size: 1.1rem; letter-spacing: 2px; min-width: 0;
    }
    .top-bar-name::placeholder { color: #444; }
    .top-bar-timer {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1rem; letter-spacing: 3px;
      color: var(--bat-yellow); white-space: nowrap; flex-shrink: 0;
    }
    .btn-finish {
      background: linear-gradient(135deg, #b00, #e00);
      color: #fff; border-radius: 8px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: .85rem; letter-spacing: 2px;
      padding: 8px 14px; flex-shrink: 0;
      transition: opacity .15s;
    }
    .btn-finish:hover { opacity: .85; }

    /* Scrollable body */
    .workout-body {
      flex: 1; overflow-y: auto; padding: 14px 14px 130px;
      display: flex; flex-direction: column; gap: 14px;
    }

    /* Exercise block */
    .exercise-block {
      background: var(--bat-gray); border: 1px solid var(--bat-border);
      border-radius: 14px; overflow: hidden;
    }
    .ex-header {
      display: flex; align-items: center; gap: 8px;
      padding: 12px 14px 10px; border-bottom: 1px solid var(--bat-border);
    }
    .ex-header-name {
      flex: 1; font-family: 'Bebas Neue', sans-serif;
      font-size: 1rem; letter-spacing: 2px; color: var(--bat-yellow);
    }
    .btn-del-ex {
      color: #444; font-size: 1rem; line-height: 1;
      padding: 4px 6px; border-radius: 6px; transition: color .15s;
    }
    .btn-del-ex:hover { color: #e55; }

    /* Set table */
    .set-table-head {
      display: grid; grid-template-columns: 32px 1fr 1fr 1fr 44px;
      gap: 4px; padding: 6px 14px; border-bottom: 1px solid #1e1e1e;
    }
    .set-table-head span {
      font-size: .6rem; letter-spacing: 2px;
      color: #555; text-transform: uppercase; text-align: center;
    }
    .set-table-head span:first-child { text-align: left; }

    .set-rows { display: flex; flex-direction: column; }
    .set-row {
      display: grid; grid-template-columns: 32px 1fr 1fr 1fr 44px;
      gap: 4px; align-items: center; padding: 7px 14px;
      border-bottom: 1px solid #1c1c1c; transition: background .2s;
    }
    .set-row:last-child { border-bottom: none; }
    .set-row.done { background: #1c1700; }

    .set-num { font-family: 'Bebas Neue', sans-serif; font-size: .95rem; color: #555; }
    .set-row.done .set-num { color: var(--bat-yellow); }

    .set-prev {
      font-size: .7rem; color: #555; text-align: center;
      line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .set-input {
      background: var(--bat-mid); border: 1px solid #2e2e2e; border-radius: 6px;
      outline: none; color: var(--bat-text); text-align: center;
      font-family: 'Oswald', sans-serif; font-size: .9rem;
      padding: 7px 4px; width: 100%; transition: border-color .15s;
      -moz-appearance: textfield;
    }
    .set-input::-webkit-inner-spin-button,
    .set-input::-webkit-outer-spin-button { -webkit-appearance: none; }
    .set-input:focus { border-color: var(--bat-yellow-dark); }
    .set-row.done .set-input { background: #1a1500; border-color: #3a3000; color: var(--bat-yellow); }

    .btn-check {
      width: 36px; height: 36px; border-radius: 50%; border: 2px solid #333;
      display: flex; align-items: center; justify-content: center; justify-self: center;
      font-size: .9rem; color: transparent; transition: all .15s;
    }
    .btn-check:hover { border-color: var(--bat-yellow-dark); color: #555; }
    .set-row.done .btn-check { background: var(--bat-yellow); border-color: var(--bat-yellow); color: #111; }

    .btn-add-set {
      width: 100%; padding: 10px; color: var(--bat-yellow);
      font-family: 'Bebas Neue', sans-serif; font-size: .85rem; letter-spacing: 2px;
      opacity: .7; transition: opacity .15s; border-top: 1px solid var(--bat-border);
    }
    .btn-add-set:hover { opacity: 1; }

    /* Add exercise floating button */
    .btn-add-exercise {
      position: fixed; bottom: calc(20px + var(--safe-bottom)); left: 50%;
      transform: translateX(-50%);
      width: min(calc(100% - 28px), 460px); padding: 16px;
      background: var(--bat-gray); border: 1px solid #333; border-radius: 14px;
      color: var(--bat-yellow); font-family: 'Bebas Neue', sans-serif;
      font-size: 1.1rem; letter-spacing: 3px;
      box-shadow: 0 8px 32px #000a; transition: border-color .15s, background .15s;
    }
    .btn-add-exercise:hover { border-color: var(--bat-yellow-dark); background: #1c1700; }

    /* Empty state */
    .empty-workout { text-align: center; padding: 48px 20px; color: #444; }
    .empty-workout .empty-icon { font-size: 3rem; margin-bottom: 12px; }
    .empty-workout p { font-size: .75rem; letter-spacing: 2px; text-transform: uppercase; line-height: 1.6; }

    /* ══════════════════════════════════════════
       REST TIMER SHEET
    ══════════════════════════════════════════ */
    #rest-sheet {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 500;
      background: #131300; border-top: 1px solid var(--bat-yellow-dark);
      border-radius: 20px 20px 0 0;
      padding: 18px 20px calc(20px + var(--safe-bottom));
      display: flex; align-items: center; gap: 16px;
      transform: translateY(100%);
      transition: transform .3s cubic-bezier(.25,.8,.25,1);
      box-shadow: 0 -8px 40px #000c;
    }
    #rest-sheet.open { transform: translateY(0); }

    .rest-ring { position: relative; flex-shrink: 0; width: 68px; height: 68px; }
    .rest-ring svg { transform: rotate(-90deg); }
    .rest-ring-bg   { fill:none; stroke:#222; stroke-width:5; }
    .rest-ring-prog {
      fill:none; stroke: var(--bat-yellow); stroke-width:5; stroke-linecap:round;
      stroke-dasharray: 188; stroke-dashoffset: 0;
      filter: drop-shadow(0 0 4px #FFD700); transition: stroke-dashoffset .5s linear;
    }
    .rest-ring-label {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Bebas Neue', sans-serif; font-size: 1.15rem; letter-spacing: 2px;
      color: var(--bat-yellow);
    }
    .rest-info { flex: 1; min-width: 0; }
    .rest-title {
      font-family: 'Bebas Neue', sans-serif; font-size: .75rem; letter-spacing: 3px;
      color: var(--bat-yellow); opacity: .6; margin-bottom: 2px;
    }
    .rest-exercise { font-size: .8rem; color: #888; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .rest-actions { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
    .btn-rest-skip {
      font-family: 'Bebas Neue', sans-serif; font-size: .75rem; letter-spacing: 2px;
      color: #555; transition: color .15s;
    }
    .btn-rest-skip:hover { color: #aaa; }
    .btn-rest-add30 {
      font-family: 'Bebas Neue', sans-serif; font-size: .75rem; letter-spacing: 1px;
      color: var(--bat-yellow); opacity: .6; transition: opacity .15s;
    }
    .btn-rest-add30:hover { opacity: 1; }

    /* ══════════════════════════════════════════
       EXERCISE PICKER MODAL
    ══════════════════════════════════════════ */
    #modal-overlay {
      position: fixed; inset: 0; z-index: 800; background: #000a;
      display: flex; align-items: flex-end;
      opacity: 0; pointer-events: none; transition: opacity .25s;
    }
    #modal-overlay.open { opacity: 1; pointer-events: all; }

    .modal-sheet {
      width: 100%; background: #131313;
      border-top: 1px solid var(--bat-border); border-radius: 20px 20px 0 0;
      padding-bottom: calc(24px + var(--safe-bottom));
      max-height: 80vh; display: flex; flex-direction: column;
      transform: translateY(40px); transition: transform .25s;
    }
    #modal-overlay.open .modal-sheet { transform: translateY(0); }

    .modal-handle { width: 40px; height: 4px; border-radius: 2px; background: #333; margin: 12px auto 0; }
    .modal-header {
      display: flex; align-items: center; gap: 10px;
      padding: 14px 16px 10px; border-bottom: 1px solid var(--bat-border);
    }
    .modal-title {
      font-family: 'Bebas Neue', sans-serif; font-size: 1rem; letter-spacing: 3px;
      color: var(--bat-yellow); flex: 1;
    }
    .btn-modal-close { color: #555; font-size: 1.1rem; padding: 4px 8px; border-radius: 6px; transition: color .15s; }
    .btn-modal-close:hover { color: #aaa; }

    .modal-search-wrap { padding: 10px 16px; }
    .modal-search {
      width: 100%; background: var(--bat-mid); border: 1px solid var(--bat-border);
      border-radius: 8px; color: var(--bat-text); outline: none;
      font-size: .85rem; padding: 9px 12px; transition: border-color .15s;
    }
    .modal-search:focus { border-color: #444; }
    .modal-search::placeholder { color: #444; }

    .modal-list { overflow-y: auto; flex: 1; }
    .modal-category {
      padding: 10px 16px 4px;
      font-family: 'Bebas Neue', sans-serif; font-size: .65rem; letter-spacing: 3px;
      color: #444; text-transform: uppercase;
    }
    .modal-ex-item {
      display: flex; align-items: center; padding: 13px 16px; gap: 12px;
      border-bottom: 1px solid #1a1a1a; cursor: pointer; transition: background .15s;
    }
    .modal-ex-item:hover { background: #1e1e1e; }
    .modal-ex-item:active { background: #1c1700; }
    .modal-ex-icon { font-size: 1.3rem; flex-shrink: 0; }
    .modal-ex-info { flex: 1; min-width: 0; }
    .modal-ex-name { font-size: .85rem; color: var(--bat-text); font-weight: 600; letter-spacing: .5px; }
    .modal-ex-muscle { font-size: .68rem; color: #555; letter-spacing: .5px; margin-top: 1px; }
    .modal-ex-add { font-size: 1.2rem; color: var(--bat-yellow); opacity: .5; flex-shrink: 0; }
    .modal-ex-item:hover .modal-ex-add { opacity: 1; }

    /* ══════════════════════════════════════════
       CONFIRM DIALOG
    ══════════════════════════════════════════ */
    #confirm-overlay {
      position: fixed; inset: 0; z-index: 900; background: #000b;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity .2s;
    }
    #confirm-overlay.open { opacity: 1; pointer-events: all; }
    .confirm-box {
      background: #1a1a1a; border: 1px solid var(--bat-border);
      border-radius: 16px; padding: 24px 22px;
      width: min(320px, calc(100% - 40px));
      transform: scale(.95); transition: transform .2s; text-align: center;
    }
    #confirm-overlay.open .confirm-box { transform: scale(1); }
    .confirm-title {
      font-family: 'Bebas Neue', sans-serif; font-size: 1.1rem; letter-spacing: 3px;
      color: var(--bat-yellow); margin-bottom: 8px;
    }
    .confirm-body { font-size: .78rem; color: #888; line-height: 1.6; margin-bottom: 20px; }
    .confirm-actions { display: flex; gap: 10px; }
    .confirm-actions button { flex: 1; border-radius: 10px; padding: 13px; }
    .btn-confirm-yes {
      background: linear-gradient(135deg, #b00, #e00); color: #fff;
      font-family: 'Bebas Neue', sans-serif; font-size: 1rem; letter-spacing: 2px;
    }
    .btn-confirm-no {
      background: var(--bat-mid); border: 1px solid #333; color: #aaa;
      font-family: 'Bebas Neue', sans-serif; font-size: 1rem; letter-spacing: 2px;
    }

    /* ══════════════════════════════════════════
       SCREEN: SUMMARY
    ══════════════════════════════════════════ */
    #screen-summary {
      display: flex; flex-direction: column; align-items: center;
      padding-bottom: calc(40px + var(--safe-bottom));
    }
    .summary-header { width: 100%; text-align: center; padding: 14px 20px 16px; }
    .summary-title {
      font-family: 'Bebas Neue', sans-serif; font-size: 1.5rem; letter-spacing: 5px;
      color: var(--bat-yellow); text-shadow: 0 0 24px #FFD70055;
    }
    .summary-sub { font-size: .65rem; letter-spacing: 3px; color: #555; margin-top: 3px; }

    .summary-stats {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 1px; background: var(--bat-border); width: 100%;
      border-top: 1px solid var(--bat-border); border-bottom: 1px solid var(--bat-border);
      margin-bottom: 20px;
    }
    .stat-cell { background: var(--bat-gray); padding: 18px 10px; text-align: center; }
    .stat-val {
      font-family: 'Bebas Neue', sans-serif; font-size: 1.8rem;
      color: var(--bat-yellow); text-shadow: 0 0 12px #FFD70055; line-height: 1;
    }
    .stat-lbl { font-size: .58rem; letter-spacing: 2px; color: #555; text-transform: uppercase; margin-top: 3px; }

    .summary-exercises {
      width: min(480px, calc(100% - 28px));
      display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px;
    }
    .summary-ex-block {
      background: var(--bat-gray); border: 1px solid var(--bat-border); border-radius: 12px; overflow: hidden;
    }
    .summary-ex-name {
      padding: 10px 14px; font-family: 'Bebas Neue', sans-serif;
      font-size: .9rem; letter-spacing: 2px; color: var(--bat-yellow);
      border-bottom: 1px solid var(--bat-border);
    }
    .summary-set-row {
      display: flex; justify-content: space-between; padding: 8px 14px;
      font-size: .78rem; color: #999; border-bottom: 1px solid #1c1c1c;
    }
    .summary-set-row:last-child { border-bottom: none; }
    .summary-set-row span:last-child { color: var(--bat-text); }

    .summary-quote {
      width: min(480px, calc(100% - 28px));
      font-size: .72rem; color: #444; font-style: italic; text-align: center;
      line-height: 1.7; letter-spacing: .3px; padding: 0 8px; margin-bottom: 28px;
    }
    .summary-done-wrap { width: min(480px, calc(100% - 28px)); }
    .summary-done-wrap .btn-yellow { width: 100%; font-size: 1.3rem; }

    .hidden { display: none !important; }

    /* ══════════════════════════════════════════
       HOME TABS
    ══════════════════════════════════════════ */
    .home-tabs {
      display: flex; width: min(480px, calc(100% - 32px));
      background: var(--bat-gray); border: 1px solid var(--bat-border);
      border-radius: 10px; padding: 3px; margin-bottom: 20px; gap: 3px;
    }
    .home-tab {
      flex: 1; padding: 9px; border-radius: 8px;
      font-family: 'Bebas Neue', sans-serif; font-size: .8rem; letter-spacing: 2px;
      color: #555; transition: all .15s; text-align: center;
    }
    .home-tab.active { background: var(--bat-mid); color: var(--bat-yellow); }

    /* ══════════════════════════════════════════
       HISTORY
    ══════════════════════════════════════════ */
    .hist-list { width: min(480px, calc(100% - 32px)); display: flex; flex-direction: column; gap: 10px; padding-bottom: 8px; }
    .hist-card {
      background: var(--bat-gray); border: 1px solid var(--bat-border);
      border-radius: 14px; overflow: hidden; transition: border-color .15s;
    }
    .hist-card-header {
      display: flex; align-items: center; gap: 10px;
      padding: 14px 16px; cursor: pointer;
    }
    .hist-card-info { flex: 1; min-width: 0; }
    .hist-card-name {
      font-family: 'Bebas Neue', sans-serif; font-size: 1rem; letter-spacing: 2px;
      color: var(--bat-yellow); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .hist-card-meta { font-size: .68rem; color: #555; letter-spacing: .5px; margin-top: 3px; }
    .hist-chevron { color: #333; font-size: .7rem; flex-shrink: 0; transition: transform .2s; }
    .hist-card.open .hist-chevron { transform: rotate(180deg); }
    .hist-card-body { display: none; border-top: 1px solid var(--bat-border); }
    .hist-card.open .hist-card-body { display: block; }
    .hist-ex-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 16px; border-bottom: 1px solid #1c1c1c;
    }
    .hist-ex-row:last-child { border-bottom: none; }
    .hist-ex-name { font-size: .8rem; color: var(--bat-text); font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: 8px; }
    .hist-ex-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .hist-ex-best { font-size: .7rem; color: #555; }

  try { return JSON.parse(localStorage.getItem(HISTORY_KEY)||'{}'); } catch { return {}; }
}
function saveHistory(exercises) {
  const h = loadHistory();
  exercises.forEach(ex => {
    const done = ex.sets.filter(s=>s.done);
    if (done.length) h[ex.name] = done.map(s=>({ weight:s.weight, reps:s.reps }));
  });
  try { localStorage.setItem(HISTORY_KEY, JSON.stringify(h)); } catch {}
}

/* ── localStorage full workout log ── */
const WORKOUTS_KEY = 'batmanWorkouts';
function loadWorkouts() {
  try { return JSON.parse(localStorage.getItem(WORKOUTS_KEY)||'[]'); } catch { return []; }
}
function saveWorkout(record) {
  const list = loadWorkouts();
  list.push(record);
  if (list.length > 200) list.splice(0, list.length - 200);
  try { localStorage.setItem(WORKOUTS_KEY, JSON.stringify(list)); } catch {}
}

function renderHistoryContent() {
  const workouts = loadWorkouts().slice().reverse();
  if (!workouts.length) return `<div class="hist-empty">No workouts logged yet.<br/>Finish a session to see<br/>your history here.</div>`;
  return `<div class="hist-list">${workouts.map(renderHistCard).join('')}</div>`;
}

function renderHistCard(w) {
  const d = new Date(w.date);
  const dateStr = d.toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
  const volFmt = w.totalVol > 0 ? (w.totalVol>=1000 ? (w.totalVol/1000).toFixed(1)+'k' : Math.round(w.totalVol)+'') + ' lbs' : null;
  const meta = [dateStr, formatTime(w.elapsed), w.totalSets+' sets', volFmt].filter(Boolean).join(' · ');
  const exRows = (w.exercises||[]).map(ex=>{
    const best = ex.sets.reduce((m,s)=>Math.max(m, parseFloat(s.weight)||0), 0);
    const bestStr = best > 0 ? `${best} lbs` : `BW`;
    return `<div class="hist-ex-row">
      <span class="hist-ex-name">${escHtml(ex.name)}</span>
      <span class="hist-ex-right">
        <span class="hist-ex-best">${bestStr} · ${ex.sets.length} set${ex.sets.length!==1?'s':''}</span>
        <button class="btn-hist-progress" data-exname="${escHtml(ex.name)}" title="View progress">📈</button>
      </span>
    </div>`;
  }).join('');
  return `<div class="hist-card">
    <div class="hist-card-header">
      <div class="hist-card-info">
        <div class="hist-card-name">${escHtml(w.name)}</div>
        <div class="hist-card-meta">${meta}</div>
      </div>
      <div class="hist-chevron">▼</div>
    </div>
    <div class="hist-card-body">${exRows||'<div style="padding:12px 16px;font-size:.7rem;color:#444">No exercises logged.</div>'}</div>
  </div>`;
}

/* ══════════════════════════════════════════
   WORKOUT LOGIC
══════════════════════════════════════════ */
function startWorkout(template) {
  doFlash();
  state.workout = {
    name: template ? template.name : 'My Workout',
    startTime: Date.now(),
    elapsed: 0,
    exercises: template ? template.exercises.map(makeExercise) : [],
  };
  state.screen = 'workout';
  renderWorkout();

  clearInterval(state.elapsedInterval);
  state.elapsedInterval = setInterval(()=>{
    if (!state.workout) return;
    state.workout.elapsed = Math.floor((Date.now() - state.workout.startTime) / 1000);
    const el = document.getElementById('topBarTimer');
    if (el) el.textContent = formatTime(state.workout.elapsed);
  }, 1000);
}

function makeExercise(name) {
  const hist = loadHistory()[name];
  const first = hist && hist[0] ? makeSet(hist[0].weight, hist[0].reps) : makeSet();
  return { id:uid(), name, sets:[first] };
}
function makeSet(w='',r='')  { return { id:uid(), weight:w, reps:r, done:false }; }

function prevLabel(exIdx, setIdx) {
  const exName = state.workout.exercises[exIdx].name;
  const hist   = loadHistory()[exName];
  const p      = hist && hist[setIdx];
  if (!p || (!p.weight && !p.reps)) return '—';
  return `${p.weight||'—'} × ${p.reps||'—'}`;
}

/* ══════════════════════════════════════════
   RENDER WORKOUT
══════════════════════════════════════════ */
function renderWorkout() {
  const w = state.workout;
  document.getElementById('app').innerHTML = `
    <div id="screen-workout">
      <div class="top-bar">
        <input class="top-bar-name" id="topBarName" value="${escHtml(w.name)}" placeholder="Workout Name" maxlength="40"/>
        <div class="top-bar-timer" id="topBarTimer">${formatTime(w.elapsed)}</div>
        <button class="btn-finish" id="btnFinish">Finish</button>
      </div>
      <div class="workout-body" id="workoutBody">
        ${w.exercises.length===0
          ? `<div class="empty-workout"><div class="empty-icon">🏋️</div><p>No exercises yet.<br/>Tap below to add one.</p></div>`
          : w.exercises.map(renderExBlock).join('')}
      </div>
      <button class="btn-add-exercise" id="btnAddExercise">+ Add Exercise</button>
    </div>`;

  document.getElementById('topBarName').addEventListener('input', e=>{ state.workout.name=e.target.value; });
  document.getElementById('btnFinish').addEventListener('click', openConfirm);
  document.getElementById('btnAddExercise').addEventListener('click', openModal);

  document.getElementById('workoutBody').addEventListener('input', e=>{
    const inp = e.target;
    if (!inp.classList.contains('set-input')) return;
    state.workout.exercises[+inp.dataset.ex].sets[+inp.dataset.set][inp.dataset.field] = inp.value;
  });

  document.getElementById('workoutBody').addEventListener('click', e=>{
    const check    = e.target.closest('.btn-check');
    const addSet   = e.target.closest('.btn-add-set');
    const delEx    = e.target.closest('.btn-del-ex');
    const progress = e.target.closest('.btn-ex-progress');
    if (check)    { toggleDone(+check.dataset.ex, +check.dataset.set); return; }
    if (addSet)   { addNewSet(+addSet.dataset.addSet);                  return; }
    if (delEx)    { removeEx(+delEx.dataset.delEx);                     return; }
    if (progress) { openProgressChart(progress.dataset.exname);         return; }
  });
}

function renderExBlock(ex, exIdx) {
  return `<div class="exercise-block" data-ex-block="${exIdx}">
    <div class="ex-header">
      <div class="ex-header-name">${getExDef(ex.name).icon} ${escHtml(ex.name)}</div>
      <button class="btn-ex-progress" data-exname="${escHtml(ex.name)}" title="View progress">📈</button>
      <button class="btn-del-ex" data-del-ex="${exIdx}" aria-label="Remove">✕</button>
    </div>
    <div class="set-table-head">
      <span>Set</span><span>Previous</span><span>lbs</span><span>Reps</span><span></span>
    </div>
    <div class="set-rows">${ex.sets.map((s,si)=>renderSetRow(s,exIdx,si)).join('')}</div>
    <button class="btn-add-set" data-add-set="${exIdx}">+ Add Set</button>
  </div>`;
}

function renderSetRow(set, exIdx, setIdx) {
  const done = set.done;
  return `<div class="set-row${done?' done':''}" data-ex="${exIdx}" data-set="${setIdx}">
    <div class="set-num">${setIdx+1}</div>
    <div class="set-prev">${prevLabel(exIdx,setIdx)}</div>
    <input class="set-input" type="number" inputmode="decimal"  placeholder="lbs"  value="${escHtml(set.weight)}" data-field="weight" data-ex="${exIdx}" data-set="${setIdx}"/>
    <input class="set-input" type="number" inputmode="numeric"  placeholder="reps" value="${escHtml(set.reps)}"   data-field="reps"   data-ex="${exIdx}" data-set="${setIdx}"/>
    <button class="btn-check" data-ex="${exIdx}" data-set="${setIdx}" aria-label="Complete">✓</button>
  </div>`;
}

function toggleDone(exIdx, setIdx) {
  const set = state.workout.exercises[exIdx].sets[setIdx];
  set.done = !set.done;
  const row = document.querySelector(`.set-row[data-ex="${exIdx}"][data-set="${setIdx}"]`);
  if (row) {
    row.classList.toggle('done', set.done);
    const check = row.querySelector('.btn-check');
    const style = set.done
      ? { bg:'var(--bat-yellow)', bc:'var(--bat-yellow)', c:'#111', rowBg:'#1c1700', inBg:'#1a1500', inBc:'#3a3000', inC:'var(--bat-yellow)' }
      : { bg:'', bc:'', c:'', rowBg:'', inBg:'', inBc:'', inC:'' };
    check.style.background  = style.bg;
    check.style.borderColor = style.bc;
    check.style.color       = style.c;
    row.style.background    = style.rowBg;
    row.querySelectorAll('.set-input').forEach(inp=>{
      inp.style.background  = style.inBg;
      inp.style.borderColor = style.inBc;
      inp.style.color       = style.inC;
    });
  }
  if (set.done) startRest(state.workout.exercises[exIdx].name);
}

function addNewSet(exIdx) {
  const ex   = state.workout.exercises[exIdx];
  const si   = ex.sets.length;                          // index of the new set
  const hist = loadHistory()[ex.name];
  const prev = hist && hist[si]
    ? makeSet(hist[si].weight, hist[si].reps)           // last session's same set
    : (ex.sets.length ? makeSet(ex.sets[ex.sets.length-1].weight, ex.sets[ex.sets.length-1].reps) : makeSet());
  ex.sets.push(prev);
  const si2 = ex.sets.length - 1;
  const div = document.createElement('div');
  div.innerHTML = renderSetRow(ex.sets[si2], exIdx, si2);
  const block = document.querySelector(`[data-ex-block="${exIdx}"] .set-rows`);
  if (block) { block.appendChild(div.firstElementChild); div.firstElementChild.querySelector('input').focus(); }
}

function removeEx(exIdx) {
  state.workout.exercises.splice(exIdx, 1);
  renderWorkout();
}

/* ══════════════════════════════════════════
   REST TIMER
══════════════════════════════════════════ */
const REST_C = 2*Math.PI*30; // ~188.5

function startRest(exName) {
  clearInterval(state.rest.interval);
  Object.assign(state.rest, { active:true, total:60, remaining:60, exName });
  updateRestUI();
  document.getElementById('rest-sheet').classList.add('open');
  state.rest.interval = setInterval(()=>{
    state.rest.remaining--;
    state.rest.remaining<=0 ? stopRest() : updateRestUI();
  }, 1000);
}
function stopRest() {
  clearInterval(state.rest.interval);
  state.rest.active = false;
  document.getElementById('rest-sheet').classList.remove('open');
}
function updateRestUI() {
  const { remaining, total, exName } = state.rest;
  document.getElementById('restLabel').textContent  = formatTime(remaining);
  document.getElementById('restExName').textContent = exName;
  document.getElementById('restRingProg').style.strokeDashoffset = REST_C*(1 - remaining/total);
}

document.getElementById('btnRestSkip').addEventListener('click', stopRest);
document.getElementById('btnRestAdd30').addEventListener('click', ()=>{
  state.rest.remaining += 30;
  state.rest.total = Math.max(state.rest.total, state.rest.remaining);
  updateRestUI();
});

/* ══════════════════════════════════════════
   EXERCISE PICKER MODAL
══════════════════════════════════════════ */
function openModal() {
  document.getElementById('modal-overlay').classList.add('open');
  document.getElementById('modalSearch').value = '';
  renderModalList('');
  setTimeout(()=>document.getElementById('modalSearch').focus(), 300);
}
function closeModal() { document.getElementById('modal-overlay').classList.remove('open'); }

function renderModalList(q) {
  const query = q.trim().toLowerCase();
  const filtered = query
    ? EXERCISES.filter(e=>e.name.toLowerCase().includes(query)||e.muscle.toLowerCase().includes(query)||e.cat.toLowerCase().includes(query))
    : EXERCISES;
  const bycat = {};
  filtered.forEach(e=>{ (bycat[e.cat]=bycat[e.cat]||[]).push(e); });
  document.getElementById('modalList').innerHTML = Object.entries(bycat).map(([cat,exs])=>`
    <div class="modal-category">${cat}</div>
    ${exs.map(e=>`<div class="modal-ex-item" data-exname="${escHtml(e.name)}">
      <div class="modal-ex-icon">${e.icon}</div>
      <div class="modal-ex-info"><div class="modal-ex-name">${escHtml(e.name)}</div><div class="modal-ex-muscle">${e.muscle}</div></div>
      <div class="modal-ex-add">+</div>
    </div>`).join('')}`).join('') || '<div class="modal-category">No results</div>';
}

document.getElementById('btnModalClose').addEventListener('click', closeModal);
document.getElementById('modal-overlay').addEventListener('click', e=>{ if(e.target===document.getElementById('modal-overlay')) closeModal(); });
document.getElementById('modalSearch').addEventListener('input', e=>renderModalList(e.target.value));
document.getElementById('modalList').addEventListener('click', e=>{
  const item = e.target.closest('.modal-ex-item');
  if (!item) return;
  appendExercise(item.dataset.exname);
  closeModal();
});

function appendExercise(name) {
  if (!state.workout) return;
  state.workout.exercises.push(makeExercise(name));
  const exIdx = state.workout.exercises.length-1;
  const ex    = state.workout.exercises[exIdx];
  const body  = document.getElementById('workoutBody');
  if (!body) return;
  const empty = body.querySelector('.empty-workout');
  if (empty) empty.remove();
  const div = document.createElement('div');
  div.innerHTML = renderExBlock(ex, exIdx);
  body.appendChild(div.firstElementChild);
}

/* ══════════════════════════════════════════
   CONFIRM / FINISH
══════════════════════════════════════════ */
function openConfirm()  { document.getElementById('confirm-overlay').classList.add('open'); }
function closeConfirm() { document.getElementById('confirm-overlay').classList.remove('open'); }

document.getElementById('btnConfirmNo').addEventListener('click', closeConfirm);
document.getElementById('btnConfirmYes').addEventListener('click', ()=>{ closeConfirm(); finishWorkout(); });

function finishWorkout() {
  clearInterval(state.elapsedInterval);
  stopRest();
  doFlash();
  const w = state.workout;
  saveHistory(w.exercises);
  const doneSets = w.exercises.flatMap(ex=>ex.sets.filter(s=>s.done));
  const vol = doneSets.reduce((a,s)=>{
    return a + (parseFloat(s.weight)||0)*(parseInt(s.reps)||0);
  }, 0);
  // Save full workout record for history + progress charts
  saveWorkout({
    id: uid(),
    name: w.name,
    date: Date.now(),
    elapsed: w.elapsed,
    totalSets: doneSets.length,
    totalVol: vol,
    exercises: w.exercises.map(ex=>({
      name: ex.name,
      sets: ex.sets.filter(s=>s.done).map(s=>({ weight:s.weight, reps:s.reps })),
    })).filter(ex=>ex.sets.length>0),
  });
  state.summary = {
    name: w.name, elapsed: w.elapsed, exercises: w.exercises,
    totalSets: doneSets.length, totalVol: vol,
    quote: QUOTES[Math.floor(Math.random()*QUOTES.length)],
  };
  state.screen  = 'summary';
  state.workout = null;
  renderSummary();
}

    </div>`;

        <button class="btn-yellow" id="btnSummaryDone">Back to Gotham</button>

  document.getElementById('btnSummaryDone').addEventListener('click', ()=>{ doFlash(); state.screen='home'; renderHome(); });

/* ══════════════════════════════════════════
   PROGRESS CHART
══════════════════════════════════════════ */
function openProgressChart(exName) {
  document.getElementById('chartTitle').textContent = exName.toUpperCase();
  document.getElementById('chartBody').innerHTML = buildChartHTML(exName);
  document.getElementById('chart-overlay').classList.add('open');
}
function closeChart() { document.getElementById('chart-overlay').classList.remove('open'); }

function buildChartHTML(exName) {
  const workouts = loadWorkouts();
  const points = workouts
    .filter(w => w.exercises && w.exercises.some(e=>e.name===exName))
    .map(w => {
      const ex = w.exercises.find(e=>e.name===exName);
      const maxW = ex.sets.reduce((m,s)=>Math.max(m, parseFloat(s.weight)||0), 0);
      const d = new Date(w.date);
      return { label: d.toLocaleDateString('en-US',{month:'short',day:'numeric'}), weight: maxW };
    })
    .slice(-10);

  if (!points.length) return `<div class="chart-no-data">No history yet.<br/>Complete a set to start tracking.</div>`;

  const maxW = Math.max(...points.map(p=>p.weight)) || 1;
  const minW = Math.min(...points.map(p=>p.weight));
  const range = (maxW - minW) || maxW || 1;
  const W = 300, H = 100, PX = 24, PY = 12;
  const cW = W - PX*2, cH = H - PY*2;
  const n = points.length;

  const coords = points.map((p,i)=>({
    x: PX + (n>1 ? (i/(n-1))*cW : cW/2),
    y: PY + (1 - (p.weight - minW)/range)*cH,
    ...p,
  }));

  const polyPts  = coords.map(c=>`${c.x.toFixed(1)},${c.y.toFixed(1)}`).join(' ');
  const areaPts  = `${coords[0].x.toFixed(1)},${H} ${polyPts} ${coords[n-1].x.toFixed(1)},${H}`;
  const dots     = coords.map((c,i)=>`<circle class="${i===n-1?'chart-dot-last':'chart-dot'}" cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="${i===n-1?5:3}"/>`).join('');
  const xLabels  = [
    `<text class="chart-axis-lbl" x="${coords[0].x.toFixed(1)}" y="${H+16}" text-anchor="middle">${coords[0].label}</text>`,
    n>1 ? `<text class="chart-axis-lbl" x="${coords[n-1].x.toFixed(1)}" y="${H+16}" text-anchor="middle">${coords[n-1].label}</text>` : '',
  ].join('');

  const last  = points[n-1].weight;
  const pb    = maxW;
  const gain  = n>1 ? +(last - points[0].weight).toFixed(1) : 0;
  const gainStr = (gain>=0?'+':'')+gain+' lbs';
  const gainColor = gain > 0 ? 'var(--bat-yellow)' : gain < 0 ? '#e55' : '#888';

  return `
    <svg viewBox="0 0 ${W} ${H+20}" style="width:100%;overflow:visible;display:block">
      <defs>
        <linearGradient id="chartGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#FFD700" stop-opacity="0.35"/>
          <stop offset="100%" stop-color="#FFD700" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <polygon class="chart-area" points="${areaPts}"/>
      <polyline class="chart-line" points="${polyPts}"/>
      ${dots}
      ${xLabels}
    </svg>
    <div class="chart-stats">
      <div class="chart-stat">
        <div class="chart-stat-val">${last>0?last+' lbs':'BW'}</div>
        <div class="chart-stat-lbl">Last Session</div>
      </div>
      <div class="chart-stat">
        <div class="chart-stat-val">${pb>0?pb+' lbs':'BW'}</div>
        <div class="chart-stat-lbl">Personal Best</div>
      </div>
      <div class="chart-stat">
        <div class="chart-stat-val" style="color:${gainColor}">${gainStr}</div>
        <div class="chart-stat-lbl">All Time</div>
      </div>
    </div>
    <div class="chart-sessions">${n} SESSION${n!==1?'S':''} TRACKED</div>`;
}

document.getElementById('btnChartClose').addEventListener('click', closeChart);
document.getElementById('chart-overlay').addEventListener('click', e=>{
  if (e.target === document.getElementById('chart-overlay')) closeChart();
});

prog.style.strokeDasharray  = REST_C;
prog.style.strokeDashoffset = 0;
renderHome();
</script>
