<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reply Smart ✨</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Nunito:wght@600;700;800;900&display=swap');

    :root {
      --deep:    #0d0520;
      --purple:  #7c3aed;
      --violet:  #a78bfa;
      --lilac:   #c4b5fd;
      --gold:    #fbbf24;
      --white:   #f5f0ff;
      --muted:   rgba(196,181,253,0.6);
      --green:   #10b981;
      --blue:    #3b82f6;
      --amber:   #f59e0b;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      background: var(--deep);
      color: var(--white);
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ─── Background ─── */
    .bg {
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse 90% 70% at 15% 0%,   #3b0764aa 0%, transparent 55%),
        radial-gradient(ellipse 70% 60% at 85% 100%,  #1e1b4baa 0%, transparent 55%),
        linear-gradient(180deg, #0d0520 0%, #120830 100%);
    }

    /* Stars */
    .stars { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
    .star {
      position: absolute; border-radius: 50%; background: white;
      animation: twinkle var(--d) ease-in-out infinite var(--dl);
    }
    @keyframes twinkle {
      0%,100%{ opacity:.1; transform:scale(1); }
      50%    { opacity:1;  transform:scale(1.5); }
    }

    /* Aurora */
    .aurora {
      position: fixed; left: -50%; width: 200%; height: 2px;
      background: linear-gradient(90deg, transparent 0%, rgba(167,139,250,.5) 35%,
        rgba(251,191,36,.5) 50%, rgba(167,139,250,.5) 65%, transparent 100%);
      filter: blur(6px); border-radius: 50%;
      animation: auroraMov 10s ease-in-out infinite;
      z-index: 1;
    }
    .aurora:nth-child(1){ top:25%; animation-delay:0s; }
    .aurora:nth-child(2){ top:60%; animation-delay:4s; opacity:.5; }
    @keyframes auroraMov {
      0%{ transform:translateX(-20%) rotate(-1deg); }
      50%{ transform:translateX(20%) rotate(1deg); }
      100%{ transform:translateX(-20%) rotate(-1deg); }
    }

    /* Horses bottom */
    .horses-row {
      position: fixed; bottom: 0; left: 0; right: 0;
      display: flex; justify-content: space-around; align-items: flex-end;
      padding: 0 4%; z-index: 2; pointer-events: none; height: 140px;
    }
    .h {
      font-size: var(--s, 72px);
      opacity: var(--o, .1);
      filter: brightness(.35) sepia(1) saturate(5) hue-rotate(240deg);
      animation: bob var(--bd, 4s) ease-in-out infinite var(--bdelay, 0s);
      line-height: 1;
    }
    .h.r { animation-name: bob-r; }
    @keyframes bob   { 0%,100%{transform:scaleX(-1) translateY(0)}  50%{transform:scaleX(-1) translateY(-10px)} }
    @keyframes bob-r { 0%,100%{transform:scaleX(1)  translateY(0)}  50%{transform:scaleX(1)  translateY(-10px)} }

    /* ─── Content ─── */
    .page { position: relative; z-index: 10; max-width: 640px; margin: 0 auto; padding: 0 16px 120px; }

    /* Header */
    .header { text-align: center; padding: 44px 0 32px; }
    .header-emojis { font-size: 36px; letter-spacing: 6px; display: block; margin-bottom: 14px; filter: drop-shadow(0 0 14px rgba(251,191,36,.6)); }
    .header h1 {
      font-family: 'Cinzel', serif; font-size: clamp(28px, 8vw, 40px); font-weight: 900;
      background: linear-gradient(135deg, var(--gold) 0%, var(--lilac) 55%, var(--gold) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      letter-spacing: 3px; margin-bottom: 10px;
    }
    .header p { color: var(--muted); font-size: 16px; font-weight: 700; }

    .divider {
      width: 160px; height: 1.5px; margin: 0 auto 28px;
      background: linear-gradient(90deg, transparent, var(--gold), var(--violet), var(--gold), transparent);
      box-shadow: 0 0 10px rgba(251,191,36,.4); border-radius: 2px;
    }

    /* Glass card */
    .card {
      background: rgba(124,58,237,.14);
      border: 1.5px solid rgba(167,139,250,.25);
      border-radius: 22px; padding: 24px; margin-bottom: 18px;
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 8px 32px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.06);
    }
    .card-label {
      font-family: 'Cinzel', serif; font-size: 13px; font-weight: 700;
      color: var(--gold); letter-spacing: 1.5px; text-transform: uppercase;
      margin-bottom: 14px;
    }

    /* Textarea */
    textarea {
      width: 100%; min-height: 140px;
      background: rgba(13,5,32,.65);
      border: 1.5px solid rgba(167,139,250,.3);
      border-radius: 14px; padding: 16px 18px;
      color: var(--white); font-family: 'Nunito', sans-serif;
      font-size: 16px; font-weight: 700; line-height: 1.6;
      resize: vertical; outline: none; transition: border-color .2s, box-shadow .2s;
    }
    textarea::placeholder { color: rgba(196,181,253,.35); font-style: italic; font-weight: 600; }
    textarea:focus { border-color: var(--violet); box-shadow: 0 0 0 3px rgba(124,58,237,.2); }

    /* Button */
    .btn {
      width: 100%; padding: 19px;
      background: linear-gradient(135deg, #4c1d95 0%, #7c3aed 45%, #9333ea 75%, #c026d3 100%);
      color: white; border: 1.5px solid rgba(251,191,36,.35);
      border-radius: 20px; font-family: 'Cinzel', serif;
      font-size: clamp(16px, 4vw, 20px); font-weight: 700; letter-spacing: 1.5px;
      cursor: pointer; margin-bottom: 20px;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      box-shadow: 0 6px 28px rgba(124,58,237,.5), inset 0 1px 0 rgba(255,255,255,.12);
      transition: opacity .2s, transform .15s, box-shadow .2s;
    }
    .btn:hover:not(:disabled){ opacity:.9; transform:translateY(-2px); box-shadow:0 10px 36px rgba(124,58,237,.65); }
    .btn:active:not(:disabled){ transform:scale(.98); }
    .btn:disabled { opacity:.35; cursor:not-allowed; }

    /* Loading */
    .loading { display:none; text-align:center; padding:36px 0; }
    .loading.show { display:block; }
    .horse-run { font-size:44px; display:block; margin-bottom:14px; animation:runHorse 1.6s ease-in-out infinite; }
    @keyframes runHorse { 0%{transform:translateX(-20px) scaleX(-1)} 50%{transform:translateX(20px) scaleX(-1)} 100%{transform:translateX(-20px) scaleX(-1)} }
    .loading p { color:var(--lilac); font-family:'Cinzel',serif; font-size:14px; letter-spacing:1px; }

    /* Error */
    .error-box {
      display:none; background:rgba(185,28,28,.2);
      border:1.5px solid rgba(252,165,165,.35);
      border-radius:14px; padding:16px 20px;
      color:#fca5a5; font-size:15px; margin-bottom:18px; line-height:1.5;
    }
    .error-box.show { display:block; }

    /* Results */
    .results { display:none; }
    .results.show { display:block; }
    .results-title {
      font-family:'Cinzel',serif; font-size:20px; font-weight:700;
      text-align:center; margin-bottom:20px;
      background:linear-gradient(135deg,var(--gold),var(--lilac));
      -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
    }

    /* Reply cards */
    .reply { border-radius:22px; padding:22px; margin-bottom:16px; position:relative; overflow:hidden; }
    .reply::before { content:''; position:absolute; top:0; left:0; right:0; height:2px; }

    .reply.friendly    { background:rgba(16,185,129,.1);  border:1.5px solid rgba(16,185,129,.3); }
    .reply.professional{ background:rgba(59,130,246,.1);  border:1.5px solid rgba(59,130,246,.3); }
    .reply.mirror      { background:rgba(245,158,11,.08); border:1.5px solid rgba(245,158,11,.3); }

    .reply.friendly::before    { background:linear-gradient(90deg,#10b981,#34d399,#10b981); }
    .reply.professional::before{ background:linear-gradient(90deg,#3b82f6,#60a5fa,#3b82f6); }
    .reply.mirror::before      { background:linear-gradient(90deg,#f59e0b,#fbbf24,#f59e0b); }

    .reply-badge {
      display:inline-flex; align-items:center; gap:6px;
      font-family:'Cinzel',serif; font-size:11px; font-weight:700;
      letter-spacing:1.5px; text-transform:uppercase;
      padding:4px 12px; border-radius:100px; margin-bottom:14px;
    }
    .friendly     .reply-badge { background:rgba(16,185,129,.18);  color:#6ee7b7; border:1px solid rgba(16,185,129,.35); }
    .professional .reply-badge { background:rgba(59,130,246,.18);  color:#93c5fd; border:1px solid rgba(59,130,246,.35); }
    .mirror       .reply-badge { background:rgba(245,158,11,.18);  color:#fcd34d; border:1px solid rgba(245,158,11,.35); }

    .reply-text {
      font-size:16px; font-weight:700; color:rgba(245,240,255,.9);
      line-height:1.75; white-space:pre-wrap; word-break:break-word;
    }

    .copy-btn {
      width:100%; margin-top:16px; padding:12px;
      background:transparent; border-radius:12px;
      font-family:'Nunito',serif; font-size:15px; font-weight:800;
      cursor:pointer; transition:all .2s;
      display:flex; align-items:center; justify-content:center; gap:8px;
    }
    .friendly     .copy-btn { border:1.5px solid rgba(16,185,129,.45);  color:#6ee7b7; }
    .friendly     .copy-btn:hover { background:rgba(16,185,129,.18); }
    .professional .copy-btn { border:1.5px solid rgba(59,130,246,.45);  color:#93c5fd; }
    .professional .copy-btn:hover { background:rgba(59,130,246,.18); }
    .mirror       .copy-btn { border:1.5px solid rgba(245,158,11,.45);  color:#fcd34d; }
    .mirror       .copy-btn:hover { background:rgba(245,158,11,.18); }
    .copy-btn:active { transform:scale(.97); }

    /* Again */
    .again-btn {
      width:100%; padding:16px; margin-top:4px;
      background:transparent; color:var(--violet);
      border:1.5px solid rgba(167,139,250,.35);
      border-radius:20px; font-family:'Cinzel',serif;
      font-size:15px; font-weight:700; letter-spacing:1px;
      cursor:pointer; transition:all .2s;
      display:flex; align-items:center; justify-content:center; gap:8px;
    }
    .again-btn:hover { background:rgba(124,58,237,.22); border-color:var(--violet); color:white; }
  </style>
</head>
<body>

<div class="bg"></div>
<div class="stars" id="stars"></div>
<div class="aurora"></div>
<div class="aurora"></div>

<!-- Horses along bottom -->
<div class="horses-row">
  <span class="h" style="--s:56px;--o:.08;--bd:5s;--bdelay:0s">🐎</span>
  <span class="h r" style="--s:80px;--o:.12;--bd:4s;--bdelay:1.5s">🐴</span>
  <span class="h" style="--s:64px;--o:.09;--bd:6s;--bdelay:.8s">🐎</span>
  <span class="h r" style="--s:90px;--o:.13;--bd:3.8s;--bdelay:2.2s">🐴</span>
  <span class="h" style="--s:58px;--o:.07;--bd:5.5s;--bdelay:1s">🐎</span>
  <span class="h r" style="--s:75px;--o:.1;--bd:4.5s;--bdelay:.3s">🐴</span>
</div>

<div class="page">

  <!-- Header -->
  <div class="header">
    <span class="header-emojis">🐎 ✨ 🐎</span>
    <h1>REPLY SMART</h1>
    <p>Paste any message · get 3 perfect replies instantly</p>
  </div>
  <div class="divider"></div>

  <!-- Input -->
  <div class="card">
    <div class="card-label">✦ Paste the message you received</div>
    <textarea
      id="msgInput"
      placeholder="Paste the email, text, or message here…&#10;&#10;Example: &quot;Hey are you free Saturday? We're having a party 🎉&quot;"
      oninput="updateBtn()"
    ></textarea>
  </div>

  <!-- Generate -->
  <button class="btn" id="genBtn" onclick="generate()" disabled>
    🐎 &nbsp; Generate My 3 Replies &nbsp; ✨
  </button>

  <!-- Loading -->
  <div class="loading" id="loading">
    <span class="horse-run">🐎</span>
    <p>Crafting your perfect replies…</p>
  </div>

  <!-- Error -->
  <div class="error-box" id="errBox"></div>

  <!-- Results -->
  <div class="results" id="results">
    <div class="results-title">✦ Your 3 Reply Options ✦</div>

    <div class="reply friendly">
      <span class="reply-badge">😊 Friendly</span>
      <div class="reply-text" id="rFriendly"></div>
      <button class="copy-btn" onclick="copyIt('rFriendly',this)">📋 Copy This Reply</button>
    </div>

    <div class="reply professional">
      <span class="reply-badge">💼 Professional</span>
      <div class="reply-text" id="rPro"></div>
      <button class="copy-btn" onclick="copyIt('rPro',this)">📋 Copy This Reply</button>
    </div>

    <div class="reply mirror">
      <span class="reply-badge">🪞 Their Tone</span>
      <div class="reply-text" id="rMirror"></div>
      <button class="copy-btn" onclick="copyIt('rMirror',this)">📋 Copy This Reply</button>
    </div>

    <button class="again-btn" onclick="reset()">🐎 &nbsp; Reply To Another Message</button>
  </div>

</div>

<script>
// ── Stars ──────────────────────────────────────────────
(function(){
  const el = document.getElementById('stars');
  for(let i=0;i<100;i++){
    const s = document.createElement('div');
    const sz = Math.random()*2+0.5;
    s.className='star';
    s.style.cssText=`width:${sz}px;height:${sz}px;top:${Math.random()*100}%;left:${Math.random()*100}%;--d:${(Math.random()*4+2).toFixed(1)}s;--dl:-${(Math.random()*5).toFixed(1)}s`;
    el.appendChild(s);
  }
})();

// ── Button enable/disable ──────────────────────────────
function updateBtn(){
  document.getElementById('genBtn').disabled =
    document.getElementById('msgInput').value.trim().length === 0;
}

// ── Generate ──────────────────────────────────────────
async function generate(){
  const msg = document.getElementById('msgInput').value.trim();
  if(!msg) return;

  document.getElementById('errBox').classList.remove('show');
  document.getElementById('results').classList.remove('show');
  document.getElementById('loading').classList.add('show');
  document.getElementById('genBtn').disabled = true;

  try {
    const res = await fetch('/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: msg })
    });

    const data = await res.json();
    if(!res.ok) throw new Error(data.error || 'Something went wrong');

    document.getElementById('rFriendly').textContent = data.friendly     || '';
    document.getElementById('rPro').textContent      = data.professional || '';
    document.getElementById('rMirror').textContent   = data.mirror       || '';

    document.getElementById('results').classList.add('show');
    setTimeout(()=> document.getElementById('results').scrollIntoView({behavior:'smooth',block:'start'}), 100);

  } catch(e){
    const box = document.getElementById('errBox');
    box.textContent = '😕 ' + (e.message || 'Something went wrong. Please try again.');
    box.classList.add('show');
  } finally {
    document.getElementById('loading').classList.remove('show');
    document.getElementById('genBtn').disabled = false;
  }
}

// ── Copy ─────────────────────────────────────────────
function copyIt(id, btn){
  navigator.clipboard.writeText(document.getElementById(id).textContent).then(()=>{
    const o = btn.innerHTML;
    btn.innerHTML = '✅ Copied!';
    setTimeout(()=> btn.innerHTML = o, 2000);
  });
}

// ── Reset ─────────────────────────────────────────────
function reset(){
  document.getElementById('msgInput').value = '';
  document.getElementById('results').classList.remove('show');
  document.getElementById('genBtn').disabled = true;
  window.scrollTo({top:0,behavior:'smooth'});
  setTimeout(()=> document.getElementById('msgInput').focus(), 600);
}
</script>
</body>
</html>
