    :root {
      --onyx:        #070708;
      --obsidian:    #0c0c0e;
      --graphite:    #121214;
      --slate:       #17171a;
      --hairline:    rgba(212,183,120,0.14);
      --hairline-2:  rgba(255,255,255,0.05);
      --champagne:   #d4b778;
      --champagne-l: #ecd9a8;
      --champagne-d: #a8874e;
      --gold-glow:   rgba(212,183,120,0.08);
      --ivory:       #f2ede2;
      --pearl:       #b8b2a4;
      --smoke:       #6e6a60;
      --shadow:      rgba(0,0,0,0.55);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--onyx);
      background-image:
        radial-gradient(ellipse 80% 40% at 50% -5%, rgba(212,183,120,0.06), transparent 60%),
        radial-gradient(ellipse 60% 30% at 50% 100%, rgba(212,183,120,0.03), transparent 60%);
      background-attachment: fixed;
      color: var(--ivory);
      font-family: 'Jost', sans-serif;
      font-weight: 300;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      letter-spacing: 0.01em;
    }

    ::selection { background: rgba(212,183,120,0.25); }

    /* ── HEADER ── */
    .hdr {
      position: sticky;
      top: 0;
      z-index: 200;
      text-align: center;
      padding: 26px 20px 20px;
      background: linear-gradient(to bottom, rgba(7,7,8,0.97), rgba(7,7,8,0.88));
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--hairline);
    }
    .hdr::after {
      content: '';
      position: absolute;
      left: 50%; bottom: -1px;
      transform: translateX(-50%);
      width: 160px; height: 1px;
      background: linear-gradient(90deg, transparent, var(--champagne), transparent);
    }
    .hdr-monogram {
      font-family: 'Cormorant Garamond', serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 7px;
      text-indent: 7px;
      color: var(--champagne);
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .hdr-rule {
      width: 34px; height: 1px;
      margin: 0 auto 10px;
      background: linear-gradient(90deg, transparent, var(--champagne-d), transparent);
    }
    .hdr-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 30px;
      font-weight: 500;
      letter-spacing: 1.5px;
      color: var(--ivory);
      line-height: 1.1;
    }
    .hdr-title em {
      font-style: italic;
      color: var(--champagne-l);
    }
    .hdr-subtitle {
      margin-top: 7px;
      font-size: 9px;
      font-weight: 400;
      letter-spacing: 5px;
      text-indent: 5px;
      text-transform: uppercase;
      color: var(--smoke);
    }

    /* ── LAYOUT ── */
    .wrap {
      max-width: 680px;
      margin: 0 auto;
      padding: 0 18px 120px;
    }

    /* ── DAY TABS ── */
    .tabs-row {
      display: flex;
      justify-content: flex-start;
      gap: 2px;
      padding: 22px 0 4px;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .tabs-row::-webkit-scrollbar { display: none; }
    .tab-btn {
      flex: 1 0 auto;
      min-width: 62px;
      padding: 12px 10px 14px;
      background: transparent;
      border: none;
      color: var(--smoke);
      font-family: 'Jost', sans-serif;
      font-size: 10.5px;
      font-weight: 500;
      letter-spacing: 3px;
      text-indent: 3px;
      text-transform: uppercase;
      cursor: pointer;
      position: relative;
      transition: color 0.25s ease;
    }
    .tab-btn::after {
      content: '';
      position: absolute;
      left: 50%; bottom: 6px;
      transform: translateX(-50%) scaleX(0);
      width: 26px; height: 1px;
      background: var(--champagne);
      transition: transform 0.3s ease;
    }
    .tab-btn:hover { color: var(--pearl); }
    .tab-btn.active {
      color: var(--champagne-l);
    }
    .tab-btn.active::after { transform: translateX(-50%) scaleX(1); }
    .tab-btn.today-dot::before {
      content: '';
      position: absolute;
      top: 4px; left: 50%;
      transform: translateX(-50%);
      width: 3px; height: 3px;
      border-radius: 50%;
      background: var(--champagne);
      opacity: 0.8;
    }

    /* ── PROGRESS ── */
    .prog-row {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 0 22px;
    }
    .prog-track {
      flex: 1;
      height: 1px;
      background: var(--hairline-2);
      position: relative;
      overflow: visible;
    }
    .prog-fill {
      position: absolute;
      left: 0; top: -0.5px;
      height: 2px;
      background: linear-gradient(90deg, var(--champagne-d), var(--champagne-l));
      box-shadow: 0 0 12px rgba(212,183,120,0.35);
      transition: width 0.5s cubic-bezier(0.22,1,0.36,1);
    }
    .prog-lbl {
      font-family: 'Cormorant Garamond', serif;
      font-size: 15px;
      font-style: italic;
      color: var(--pearl);
      white-space: nowrap;
      letter-spacing: 0.5px;
    }
    .prog-lbl b {
      font-style: normal;
      font-weight: 600;
      color: var(--champagne-l);
    }

    /* ── ALERT ── */
    .alert {
      position: relative;
      margin-bottom: 26px;
      padding: 18px 22px;
      background: linear-gradient(135deg, rgba(212,183,120,0.06), rgba(212,183,120,0.02));
      border: 1px solid var(--hairline);
      text-align: center;
    }
    .alert::before, .alert::after {
      content: '';
      position: absolute;
      width: 9px; height: 9px;
      border-color: var(--champagne-d);
      border-style: solid;
      opacity: 0.7;
    }
    .alert::before { top: -1px; left: -1px; border-width: 1px 0 0 1px; }
    .alert::after  { bottom: -1px; right: -1px; border-width: 0 1px 1px 0; }
    .alert-txt {
      font-size: 11px;
      font-weight: 300;
      line-height: 1.9;
      letter-spacing: 0.08em;
      color: var(--champagne-l);
      text-transform: uppercase;
      font-size: 9.5px;
    }

    /* ── ACTIONS ── */
    .actions-row {
      display: flex;
      justify-content: center;
      margin-bottom: 28px;
    }
    .btn-reset {
      padding: 10px 26px;
      background: transparent;
      border: 1px solid var(--hairline-2);
      color: var(--smoke);
      font-family: 'Jost', sans-serif;
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 3px;
      text-indent: 3px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .btn-reset:hover {
      border-color: var(--hairline);
      color: var(--pearl);
    }

    /* ── SECTION CARD ── */
    .card {
      margin-bottom: 18px;
      background: linear-gradient(180deg, var(--obsidian), var(--graphite));
      border: 1px solid var(--hairline-2);
      box-shadow: 0 18px 45px -18px var(--shadow);
      transition: border-color 0.3s ease;
    }
    .card:hover { border-color: var(--hairline); }
    .card-head {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 22px 24px;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .card-num {
      font-family: 'Cormorant Garamond', serif;
      font-size: 13px;
      font-weight: 500;
      font-style: italic;
      color: var(--champagne-d);
      width: 22px;
      flex-shrink: 0;
      text-align: center;
    }
    .card-meta { flex: 1; min-width: 0; }
    .card-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 19px;
      font-weight: 600;
      letter-spacing: 1.5px;
      color: var(--ivory);
      text-transform: uppercase;
      display: flex;
      align-items: baseline;
      gap: 12px;
      flex-wrap: wrap;
      line-height: 1.2;
    }
    .badge {
      font-family: 'Jost', sans-serif;
      font-size: 7.5px;
      font-weight: 500;
      letter-spacing: 2.5px;
      text-indent: 2.5px;
      text-transform: uppercase;
      padding: 4px 9px 3px;
      border: 1px solid var(--hairline);
      color: var(--champagne);
      white-space: nowrap;
    }
    .card-sub {
      margin-top: 5px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 14px;
      font-style: italic;
      color: var(--smoke);
      letter-spacing: 0.5px;
    }
    .card-chevron {
      color: var(--champagne-d);
      font-size: 9px;
      flex-shrink: 0;
      transition: transform 0.35s ease;
      opacity: 0.8;
    }
    .card-head.open .card-chevron { transform: rotate(180deg); }

    .card-body {
      display: none;
      border-top: 1px solid var(--hairline-2);
    }
    .card-body.open { display: block; }

    /* Sub-heading inside card */
    .sub-heading {
      padding: 16px 24px 12px;
      font-size: 8.5px;
      font-weight: 500;
      letter-spacing: 3.5px;
      text-indent: 3.5px;
      text-transform: uppercase;
      color: var(--champagne-d);
      background: rgba(212,183,120,0.03);
      border-bottom: 1px solid var(--hairline-2);
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .sub-heading::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, var(--hairline), transparent);
    }

    /* ── CHECKLIST ── */
    .checklist { list-style: none; }
    .chk-item {
      display: flex;
      align-items: flex-start;
      gap: 18px;
      padding: 15px 24px;
      border-bottom: 1px solid var(--hairline-2);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.2s ease;
    }
    .chk-item:last-child { border-bottom: none; }
    .chk-item:hover { background: rgba(212,183,120,0.03); }
    .chk-box {
      width: 19px;
      height: 19px;
      border: 1px solid rgba(212,183,120,0.35);
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 1px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s ease;
      position: relative;
    }
    .chk-item.done .chk-box {
      background: radial-gradient(circle at 35% 30%, var(--champagne-l), var(--champagne-d));
      border-color: var(--champagne);
      box-shadow: 0 0 14px rgba(212,183,120,0.35);
    }
    .chk-tick {
      display: none;
      color: #14120c;
      font-size: 10px;
      font-weight: 600;
      line-height: 1;
    }
    .chk-item.done .chk-tick { display: block; }
    .chk-txt {
      flex: 1;
      font-size: 13.5px;
      font-weight: 300;
      line-height: 1.65;
      color: var(--ivory);
      letter-spacing: 0.03em;
      transition: color 0.25s ease, opacity 0.25s ease;
    }
    .chk-item.done .chk-txt {
      color: var(--smoke);
      opacity: 0.75;
      text-decoration: line-through;
      text-decoration-color: rgba(212,183,120,0.35);
      text-decoration-thickness: 1px;
    }
    .itag {
      display: inline-block;
      margin-left: 10px;
      padding: 2px 7px 1px;
      border: 1px solid var(--hairline);
      font-family: 'Jost', sans-serif;
      font-size: 7px;
      font-weight: 500;
      letter-spacing: 2px;
      text-indent: 2px;
      text-transform: uppercase;
      vertical-align: 2px;
    }
    .itag-s { color: var(--champagne); }
    .itag-l { color: #9fc49f; border-color: rgba(159,196,159,0.25); }

    /* ── FOOTER ── */
    .footer {
      margin-top: 40px;
      padding: 30px 26px;
      text-align: center;
      border-top: 1px solid var(--hairline);
      position: relative;
    }
    .footer::before {
      content: '';
      position: absolute;
      left: 50%; top: -1px;
      transform: translateX(-50%);
      width: 120px; height: 1px;
      background: linear-gradient(90deg, transparent, var(--champagne), transparent);
    }
    .footer-mark {
      font-family: 'Cormorant Garamond', serif;
      font-size: 20px;
      font-style: italic;
      color: var(--champagne);
      margin-bottom: 12px;
    }
    .footer-txt {
      font-family: 'Cormorant Garamond', serif;
      font-size: 16px;
      font-style: italic;
      line-height: 1.8;
      color: var(--pearl);
      max-width: 440px;
      margin: 0 auto;
    }
    .footer-brand {
      margin-top: 18px;
      font-size: 8px;
      font-weight: 500;
      letter-spacing: 4px;
      text-indent: 4px;
      text-transform: uppercase;
      color: var(--smoke);
    }
  </style>
</head>

    "Palmer's Cocoa Butter On Body",
    'Leave-In Conditioner On Hair',
    'Normal Shower',
    'Baby Wash For Face',
    'Baby Wash For Body',
    {t:'Longevity Routine For Face (Retinoid)', tag:'l'},
    'Facial Moisturizer On Face And Neck',
    {t:'Longevity Routine For Penis (Alpha Arbutin Serum)', tag:'l'},
    'Lubriderm Lotion On Body',
    {t:'Longevity Routine For Hair (Vaseline On Eyebrows And Eyelashes)', tag:'l'},
  ],
};

function buildShower(dayIdx) {
  return SHOWER_DATA[dayIdx];
}

// ─── STATE ────────────────────────────────────────────────────────────────────
const SK = 'mmm_groom_v2';

function loadState() {
  try { return JSON.parse(localStorage.getItem(SK)) || {}; } catch { return {}; }
}
function saveState(s) { localStorage.setItem(SK, JSON.stringify(s)); }

let state = loadState();

// Today: JS getDay() → 0=Sun; our index: 0=Mon … 6=Sun
const todayIdx = (new Date().getDay() + 6) % 7;
let activeDay  = todayIdx;

// ─── KEY UTILS ────────────────────────────────────────────────────────────────
function key(day, sec, idx) { return `d${day}_${sec}_${idx}`; }

function itemsOf(dayIdx) {
  const sh = buildShower(dayIdx);
  return [
    { sec:'fresh',  items: FRESHEN_UP },
    { sec:'shower', items: sh },
  ];
}

function dayStats(dayIdx) {
  let done = 0, total = 0;
  itemsOf(dayIdx).forEach(({sec, items}) => {
    items.forEach((_, i) => { total++; if (state[key(dayIdx, sec, i)]) done++; });
  });
  return { done, total };
}

function secStats(dayIdx, sec, items) {
  let done = 0;
  items.forEach((_, i) => { if (state[key(dayIdx, sec, i)]) done++; });
  return { done, total: items.length };
}

// ─── HTML HELPERS ─────────────────────────────────────────────────────────────
function itemObj(item) {
  if (typeof item === 'string') return { t: item, tag: null };
  return item;
}

function tagHTML(tag) {
  if (!tag) return '';
  const map = {
    s: `<span class="itag itag-s">Ritual</span>`,
    l: `<span class="itag itag-l">Longevity</span>`,
  };
  return map[tag] || '';
}

function buildChecklist(dayIdx, sec, items) {
  return items.map((raw, i) => {
    const {t, tag} = itemObj(raw);
    const k   = key(dayIdx, sec, i);
    const chk = state[k] ? 'done' : '';
    return `
      <li class="chk-item ${chk}" data-key="${k}">
        <div class="chk-box"><span class="chk-tick">✓</span></div>
        <span class="chk-txt">${t}${tagHTML(tag)}</span>
      </li>`;
  }).join('');
}

function buildCard(id, num, title, badgeHTML, bodyHTML) {
  return `
    <div class="card" id="card_${id}">
      <div class="card-head" data-card="${id}">
        <div class="card-num">${num}</div>
        <div class="card-meta">
          <div class="card-title">${title} ${badgeHTML}</div>
          <div class="card-sub" id="sub_${id}">—</div>
        </div>
        <div class="card-chevron">▼</div>
      </div>
      <div class="card-body" id="body_${id}">
        ${bodyHTML}
      </div>
    </div>`;
}

// ─── RENDER ───────────────────────────────────────────────────────────────────
function renderDay(dayIdx) {
  const { done, total } = dayStats(dayIdx);
  const pct = total ? Math.round((done / total) * 100) : 0;
  const sh  = buildShower(dayIdx);

  let html = `
    <div class="prog-row">
      <div class="prog-track"><div class="prog-fill" id="progFill" style="width:${pct}%"></div></div>
      <div class="prog-lbl" id="progLbl"><b>${done}</b> of ${total} complete</div>
    </div>
    <div class="alert">
      <div class="alert-txt">Always apply a protective coat of sunscreen on all exposed skin prior to going outside &middot; Pick your nose carefully with fingers and pick your ears carefully with ear picker tool when necessary</div>
    </div>
    <div class="actions-row">
      <button class="btn-reset" id="btnReset">Reset ${DAYS_FULL[dayIdx]}</button>
    </div>
  `;

  // Card I – Freshen Up
  html += buildCard('fresh','I','Freshen Up','',
    `<ul class="checklist">${buildChecklist(dayIdx,'fresh',FRESHEN_UP)}</ul>`
  );

  // Card II – Ultimate Shower Routine
  html += buildCard('shower','II','Ultimate Shower Routine','',
    `<ul class="checklist">${buildChecklist(dayIdx,'shower', sh)}</ul>`
  );

  // Footer
  html += `
    <div class="footer">
      <div class="footer-mark">✦</div>
      <div class="footer-txt">Discipline in the details. The man who masters his ritual masters his presence.</div>
      <div class="footer-brand">Money Muscle Mindset</div>
    </div>`;

  document.getElementById('dayView').innerHTML = html;

  // Wire section subtitles
  updateSubtitles(dayIdx, sh);

  // ── Wire card toggles
  document.querySelectorAll('.card-head').forEach(hd => {
    hd.addEventListener('click', () => {
      const id   = hd.dataset.card;
      const body = document.getElementById('body_' + id);
      const open = body.classList.toggle('open');
      hd.classList.toggle('open', open);
    });
  });

  // ── Wire checkboxes
  document.querySelectorAll('.chk-item').forEach(item => {
    item.addEventListener('click', () => {
      const k   = item.dataset.key;
      state[k]  = !state[k];
      saveState(state);
      item.classList.toggle('done', !!state[k]);
      refreshProgress(dayIdx, sh);
    });
  });

  // ── Reset
  document.getElementById('btnReset').addEventListener('click', () => {
    const prefix = `d${dayIdx}_`;
    Object.keys(state).forEach(k => { if (k.startsWith(prefix)) delete state[k]; });
    saveState(state);
    renderDay(dayIdx);
  });

  // Auto-open Freshen Up
  const qHead = document.querySelector('[data-card="fresh"]');
  const qBody = document.getElementById('body_fresh');
  qHead.classList.add('open');
  qBody.classList.add('open');
}

function updateSubtitles(dayIdx, sh) {
  const sets = [
    { id:'fresh',  items: FRESHEN_UP, sec:'fresh'  },
    { id:'shower', items: sh,         sec:'shower' },
  ];
  sets.forEach(({id, items, sec}) => {
    const el = document.getElementById('sub_' + id);
    if (!el) return;
    const {done, total} = secStats(dayIdx, sec, items);
    el.textContent = `${done} of ${total} complete`;
  });
}

function refreshProgress(dayIdx, sh) {
  const {done, total} = dayStats(dayIdx);
  const pct = total ? Math.round((done/total)*100) : 0;
  const fill = document.getElementById('progFill');
  const lbl  = document.getElementById('progLbl');
  if (fill) fill.style.width = pct + '%';
  if (lbl)  lbl.innerHTML  = `<b>${done}</b> of ${total} complete`;
  updateSubtitles(dayIdx, sh);
}

// ─── TABS ─────────────────────────────────────────────────────────────────────
function renderTabs() {
  const row = document.getElementById('tabsRow');
  row.innerHTML = DAYS_SHORT.map((d,i) => {
    const isCur   = i === activeDay;
    const isToday = i === todayIdx;
    return `<button class="tab-btn${isCur?' active':''}${isToday?' today-dot':''}" data-day="${i}">${d}</button>`;
  }).join('');

  row.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      activeDay = parseInt(btn.dataset.day);
      renderTabs();
      renderDay(activeDay);
      btn.scrollIntoView({ behavior:'smooth', block:'nearest', inline:'center' });
    });
  });
}

// ─── BOOT ─────────────────────────────────────────────────────────────────────
renderTabs();
renderDay(activeDay);
</script>
</body>
</html>
